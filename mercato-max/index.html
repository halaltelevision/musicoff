<title>Mercato Max Pâte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mercato Max : Mise. Bluffe. Recrute. Construis l'équipe de tes rêves aux enchères, seul ou entre amis. Manga, foot, films, sport.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&display=swap">
<style>
/* Layout : une colonne claire ; en mode amis, l'écran devient une table de jeu où chacun a sa zone de couleur */
:root{
  --bg:#F5F4FA; --card:#FFFFFF; --soft:#F0EEF7; --line:#E4E1EF;
  --ink:#1C1A2E; --mute:#6E6A85;
  --accent:#5B3DF5; --accent-soft:#ECE8FE; --coral:#FF5A5F; --green:#12B76A; --teal:#14B8A6; --amber:#F59E0B; --blue:#2E7CF6;
  --r-com:#94A3B8; --r-rare:#3B82F6; --r-epic:#A855F7; --r-leg:#F5A524;
  --gold-a:#FFE7A3; --gold-b:#F5A524;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.app{max-width:460px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;line-height:1.15}
h3{font-size:16px;line-height:1.2}
p{margin:0}
.mute{color:var(--mute)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:180px;font-size:15px;resize:vertical}

/* Base */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .08s,background .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.go{background:var(--accent);border:0;color:#fff;font-family:var(--display);font-weight:700;font-size:18px;padding:17px;box-shadow:0 10px 24px -12px rgba(91,61,245,.75)}
.btn.go.coral{background:var(--coral);box-shadow:0 10px 24px -12px rgba(255,90,95,.7)}
.btn.go.green{background:var(--green);box-shadow:0 10px 24px -12px rgba(18,183,106,.7)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:6px}
.topbar{display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--mute);flex:none}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.gift{background:#FEF3DC;color:#9A5B00}
.pill.free{background:#DCFCE7;color:#0B7A47}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}

/* Accueil */
.homebar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;font-weight:700;font-size:13px}
.lvl b{font-family:var(--display);background:var(--accent);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.lvl .bar{width:54px}
.logo{text-align:center;padding:14px 0 2px;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo .mark{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,48px);line-height:1;letter-spacing:-.03em}
.logo .mark span{color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:0;border-radius:22px;padding:18px 14px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 14px 30px -16px var(--mc)}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.mode b{font-family:var(--display);font-size:20px;line-height:1.1}
.mode small{font-weight:600;opacity:.92;font-size:13px;line-height:1.3}
.mode .ico{font-family:var(--display);font-size:13px;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px;align-self:flex-start;margin-bottom:auto}
.daily{text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;width:100%}
.daily .lbl{color:var(--accent)}
.daily h3{font-size:19px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.resume b{font-family:var(--display);font-size:15px}
.resume small{opacity:.75;font-weight:600}

/* Préparation */
.subject{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden}
.subject::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.subject b{font-family:var(--display);font-size:18px;display:block}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mute);line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(28,26,46,.15)}
.field{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.orow .t{display:flex;flex-direction:column;min-width:0}
.orow .t small{color:var(--mute);font-size:13px;line-height:1.3}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:#D9D6E5;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{left:23px}
.names{display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--tc);flex:none}
.x{border:0;background:var(--soft);color:var(--mute);border-radius:10px;width:36px;height:36px;font-size:18px}

/* Packs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:0;background:transparent;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pack{position:relative;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px 16px;display:flex;flex-direction:column;gap:4px;min-height:84px;background:var(--card);overflow:hidden}
.pack::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.pack b{font-family:var(--display);font-weight:500;font-size:14px;line-height:1.2}
.pack small{font-weight:600;font-size:12px;color:var(--mute)}
.pack.locked b{color:var(--mute)}
.pack .pill{align-self:flex-start;font-size:11px;padding:1px 8px}
.pack[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}

/* Carte */
.stage{perspective:1000px}
.card{position:relative;transform-style:preserve-3d;min-height:250px}
.face{border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{position:relative;background:var(--card);border:2px solid var(--rc,var(--line));padding:22px 16px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;justify-content:center;min-height:250px;box-shadow:0 18px 44px -22px var(--rc,rgba(28,26,46,.4));overflow:hidden}
.cback{position:absolute;inset:0;transform:rotateY(180deg);background:var(--accent);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:64px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px)}
.front.gold{background:linear-gradient(160deg,#FFF8E1,#fff 55%)}
.front.leg::after,.front.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,215,120,.45) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.stars{color:var(--rc);font-size:14px;letter-spacing:2px;line-height:1}
.rar{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.grp{font-weight:600;font-size:14px;color:var(--mute)}
.cname{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,34px);line-height:1.08;letter-spacing:-.02em}
.price{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:2px}
.price .v{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.price .who{font-weight:800;font-size:14px;min-height:20px}
.timer{width:100%;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .1s linear,background .2s}
.timer i.warn{background:var(--amber)}
.timer i.hurry{background:var(--coral)}
.call{font-family:var(--display);font-weight:700;font-size:15px;min-height:20px;color:var(--coral)}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);background:var(--tc);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;padding:10px 18px;border-radius:14px;box-shadow:0 10px 30px -10px var(--tc);white-space:nowrap;z-index:3;text-align:center;line-height:1.1}
.stamp small{display:block;font-size:13px;font-weight:700;opacity:.9}
.tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--gold-b);color:#fff;text-transform:uppercase;letter-spacing:.06em}
.event{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:12px;padding:10px 12px;text-align:center;font-size:14px}
.coach{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;text-align:center}
.coach b{color:#C9BDFF}

/* Solo */
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-top:6px}
.bot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:box-shadow .15s}
.bot.lead{box-shadow:0 0 0 2px var(--tc)}
.bot .dot{width:30px;height:30px}
.bot .nm{font-size:12px;font-weight:700;color:var(--mute);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot .num{font-size:14px}
.bubble{position:absolute;top:-8px;left:50%;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:12px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;z-index:4;pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.slots{display:flex;gap:3px;justify-content:center}
.slots i{width:10px;height:10px;border-radius:3px;background:var(--soft)}
.slots i.f{background:var(--sc,var(--tc))}
.slots i.cap{box-shadow:inset 0 0 0 1.5px var(--ink)}
.me{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.me.lead{box-shadow:0 0 0 2px var(--accent)}
.me .info{display:flex;justify-content:space-between;align-items:center;gap:8px}
.me .info .num{font-size:20px}
.bids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bidbtn{border:0;border-radius:16px;color:#fff;background:var(--tc);font-family:var(--display);font-weight:800;font-size:19px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;box-shadow:0 10px 22px -14px var(--tc);transition:transform .06s}
.bidbtn:active{transform:scale(.95)}
.bidbtn small{font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
.bidbtn:disabled{opacity:.3;box-shadow:none}

/* Mode amis : table de jeu */
.arena{display:grid;gap:10px}
.arena.n2{grid-template-rows:1fr auto 1fr}
.arena.n3,.arena.n4{grid-template-rows:auto 1fr}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--line);transition:background .15s,border-color .15s;min-width:0}
.zone.flip{transform:rotate(180deg)}
.zone.lead{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,#fff)}
.zone .head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.zone .head b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.zone .num{font-size:18px}
.zone .big{flex:1;min-height:76px;border:0;border-radius:16px;background:var(--tc);color:#fff;font-family:var(--display);font-weight:800;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .06s}
.zone .big small{font-family:var(--body);font-size:12px;font-weight:700;opacity:.92}
.zone .big:active{transform:scale(.96)}
.zone .big:disabled{opacity:.3}
.zone .mini{border:0;background:var(--soft);border-radius:12px;padding:8px;font-weight:800;font-size:14px}
.zone .mini:disabled{opacity:.4}
.zone .st{font-size:12px;font-weight:800;color:var(--tc);min-height:16px;text-align:center}
.zones .zone:nth-child(3):last-child{grid-column:1/-1}
.center{display:flex;flex-direction:column;gap:10px}
.arena .card,.arena .front{min-height:200px}
.arena .cname{font-size:clamp(22px,6.5vw,28px)}
.arena .price .v{font-size:36px}

/* Feuilles */
.sheet-wrap{position:fixed;inset:0;background:rgba(28,26,46,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:24px;padding:20px;max-width:460px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.posts{display:flex;flex-direction:column;gap:8px}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;text-align:left}
.post b{font-family:var(--display);font-size:16px}
.post small{color:var(--mute);font-weight:600;font-size:13px;display:block}
.post .m{font-family:var(--display);font-weight:800;font-size:20px;color:var(--mute)}
.post.cap{border-color:var(--accent);background:var(--accent-soft)}
.post.cap .m{color:var(--accent)}
.lineup{display:flex;flex-direction:column;gap:4px}
.lineup div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--soft)}
.lineup div:last-child{border-bottom:0}
.lineup span:first-child{color:var(--mute);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* Résultats */
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:center}
.versus .side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.versus .side b{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.versus .sc{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.duel{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;opacity:.15;transition:opacity .3s,transform .3s;transform:translateY(6px)}
.duel.on{opacity:1;transform:none}
.duel .s{display:flex;flex-direction:column;min-width:0}
.duel .s:last-child{text-align:right;align-items:flex-end}
.duel .s span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.duel .s small{font-family:var(--display);font-weight:800;font-size:18px;color:var(--mute)}
.duel .s.w small{color:var(--green)}
.duel .s:not(.w) span{color:var(--mute)}
.duel .mid{text-align:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);line-height:1.3}
.rank{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;opacity:.15;transition:opacity .3s,transform .3s;transform:translateY(6px)}
.rank.on{opacity:1;transform:none}
.rank .pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--mute)}
.rank b{font-weight:800}
.rhead{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
.rhead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.rlist{display:flex;flex-direction:column}
.rlist>span{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--soft)}
.rlist>span>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rlist>span>span:last-child{flex:none;font-size:13px}
.rank .num{font-size:20px}
.rank.first{border:2px solid var(--gold-b);background:#FFFBEF}
.winner{text-align:center;padding:12px 0 2px;opacity:0;transform:scale(.9);transition:opacity .4s,transform .4s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:10px}
.winner.on{opacity:1;transform:none}
.winner .big{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1.1;letter-spacing:-.02em}
.after{display:flex;flex-direction:column;gap:12px;opacity:0;transition:opacity .4s;pointer-events:none}
.after.on{opacity:1;pointer-events:auto}
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.award{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.award b{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.award small{font-size:12px;color:var(--mute);font-weight:600;overflow-wrap:anywhere}
.award .lbl{font-size:10px}
details.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.detail summary{font-weight:800;cursor:pointer}
.tl{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.tl h4{margin:10px 0 2px;font-size:14px;color:var(--tc)}
.tl div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--soft)}
.tl div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl div span:last-child{flex:none}
.tl em{font-style:normal;color:var(--mute);font-size:11px;font-weight:800;text-transform:uppercase;margin-right:4px}
.series{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* Boutique, trophées, règles */
.dev{background:var(--soft);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.dev .num{font-size:22px;letter-spacing:.04em;user-select:all}
.prod{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card)}
.prod .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.prod .l b{font-family:var(--display);font-weight:700;font-size:15px}
.prod .l span{font-size:13px;color:var(--mute)}
.prod .p{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent);flex:none}
.prod.own{border-color:var(--green)}
.prod.own .p{color:var(--green);font-size:13px;font-family:var(--body)}
.prod.feat{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.freebox{background:#ECFDF3;border:1px solid #BBF0D2;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.freebox b{color:#0B7A47}
.freebox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--mute)}
.steps b{color:var(--ink)}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;opacity:.5}
.ach div.on{opacity:1;border-color:var(--accent)}
.ach b{font-size:14px;line-height:1.2}
.ach small{font-size:12px;color:var(--mute);line-height:1.3}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stats .num{font-size:22px}
.stats small{font-weight:700;font-size:11px;color:var(--mute)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .l{display:flex;flex-direction:column;min-width:0}
.item .l small{color:var(--mute)}
.rules{display:flex;flex-direction:column;gap:12px}
.rules div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.rules span{font-family:var(--display);font-weight:700;font-size:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font-weight:700;border-radius:12px;padding:10px 16px;z-index:70;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.err{color:#E5484D;font-size:14px;font-weight:600;min-height:1em}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.roster.empty{color:var(--mute);font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:4px 10px 4px 8px;font-size:13px;font-weight:700;max-width:100%}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--rc);flex:none}
.chip em{font-style:normal;color:var(--mute);font-weight:700;font-size:12px}
.turnline{font-weight:800;font-size:14px;color:#fff;background:var(--tc);border-radius:99px;padding:5px 14px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts .passbtn{grid-column:1/-1}
.passbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:800;font-size:15px;color:var(--ink)}
.passbtn:disabled{opacity:.35}
.acts.wide .bidbtn{font-size:19px;padding:12px 2px}
.me.myturn{box-shadow:0 0 0 3px var(--accent)}
.bot.turn{box-shadow:0 0 0 3px var(--tc)}
.bot .cnt{font-size:11px;color:var(--mute);font-weight:700}
.bot .bst{font-size:11px;font-weight:800;color:var(--tc);min-height:15px}
.zone.turn{border-color:var(--tc);box-shadow:0 0 0 3px var(--tc);background:color-mix(in srgb,var(--tc) 8%,#fff)}
.zone:not(.turn) .acts{opacity:.55}
.teamsview h4{margin:12px 0 0;font-size:14px}
.edrows{display:flex;flex-direction:column;gap:8px}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 40px;gap:8px;align-items:center}
.edrow .lvlin{text-align:center;font-weight:800}
.edrow .x{width:40px;height:44px}
/* --- Écran de jeu compact --- */
body.ingame{padding-block:6px}
.gscreen{height:calc(100dvh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:500px}
.gscreen>*{animation:none}
.game{height:100%;display:flex;flex-direction:column;gap:8px}
.game>.stage{flex:1;min-height:0;display:flex}
.game .card{flex:1;display:flex;min-height:0}
.game .front{flex:1;min-height:0;padding:40px 12px 12px;gap:5px;border-radius:20px;justify-content:center}
.cbar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.cbar .mini{border:0;background:var(--soft);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;color:var(--mute)}
.cbar .lbl{font-size:11px}
.game .tag{position:static;font-size:10px;padding:2px 10px}
.evline{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px}
.rline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.rline .rar{font-size:11px}.rline .grp{font-size:13px}
.game .cname{font-size:clamp(22px,4.4vh,34px)}
.pline{display:flex;flex-direction:column;align-items:center}
.pline .v{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vh,46px);line-height:1;font-variant-numeric:tabular-nums}
.pline .who{font-size:13px;font-weight:800}
.turnline{font-size:13px;padding:4px 12px}
.game .timer{height:6px;max-width:260px}
.game .call{font-size:13px;min-height:16px}
.soldline{background:var(--tc);color:#fff;font-weight:700;border-radius:12px;padding:6px 14px;font-size:14px}
.nb{width:100%;max-width:320px;padding:13px;font-size:16px;margin-top:4px}
.game .coach{font-size:12px;padding:6px 10px;max-width:320px;border-radius:10px}
.zone{border-radius:16px;padding:8px 10px;gap:6px;border-width:2px}
.zone.turn{box-shadow:0 0 0 2px var(--tc)}
.zhead{display:flex;align-items:center;gap:6px;min-width:0}
.zhead b{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.zone{position:relative}
.zst{position:absolute;top:-10px;right:12px;font-size:11px;font-weight:800;color:#fff;background:var(--tc);border-radius:99px;padding:1px 10px;white-space:nowrap;z-index:2}
.zhead .cnt{font-size:12px;color:var(--mute);font-weight:700;margin-left:auto}
.zhead .num{font-size:16px}
.roster{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;min-height:24px;margin:0;scrollbar-width:none}
.roster::-webkit-scrollbar{display:none}
.roster .none{font-size:12px;color:var(--mute);font-weight:600;align-self:center}
.chip{flex:none;font-size:12px;padding:3px 8px 3px 6px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.acts.g2{grid-template-columns:1fr 1fr}
.acts .bidbtn{font-size:16px;padding:7px 2px;border-radius:12px;gap:0;box-shadow:none}
.acts .bidbtn small{font-size:10px}
.acts .passbtn{grid-column:auto;border-radius:12px;padding:7px 2px;font-size:14px}
.game .zones{gap:8px}
.game .bots{margin:0;gap:6px}
.game .bot{flex-direction:row;padding:6px 8px;gap:6px;align-items:center;text-align:left;border-radius:12px;font:inherit}
.game .bot .dot{width:26px;height:26px;font-size:11px}
.bi{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.game .bot .nm{font-size:11px}
.game .bot .num{font-size:13px}
.game .bot .bst{font-size:10px;min-height:0;font-weight:800;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .bubble{top:100%;transform:translate(-50%,6px)}
.game .bubble::after{bottom:auto;top:-5px;border-top:0;border-bottom:5px solid var(--ink)}
.lineup div{align-items:center}
@media (max-height:600px){.game .front{padding-top:36px;gap:3px}.acts .bidbtn small{display:none}.pline .v{font-size:30px}.roster{min-height:22px}}

/* ===== Thème Pâte à modeler : tout a l'air modelé à la main ===== */
:root{
  --bg:#EFE6D8; --card:#FFF8EE; --soft:#E9DFCE; --line:#E2D6C3;
  --ink:#3B2E25; --mute:#7A6A5C;
  --accent:#E5533D; --accent-soft:#FBE3D9; --coral:#4FAED8; --green:#5FB04F; --teal:#5FB04F; --amber:#F2A93B; --blue:#4FAED8;
  --r-com:#A89C8C; --r-rare:#4FAED8; --r-epic:#B07ACC; --r-leg:#F2B33D; --gold-b:#F2B33D;
  --display:"Baloo Bhai 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo Bhai 2",system-ui,sans-serif;
  --clay:inset -4px -6px 9px rgba(0,0,0,.13), inset 4px 4px 8px rgba(255,255,255,.6), 4px 7px 12px rgba(70,45,20,.16);
  --clay-in:inset 4px 6px 10px rgba(0,0,0,.16), inset -3px -3px 6px rgba(255,255,255,.5);
  --chip:#F1E7D6; --track:#F3E9DA; --deep:#5A3B1E; --sub:#6E5A48; --base:#FFF8EE; --goldcard:#FFD66B; --first:#FFE9A8;
}
body{font-weight:600}
h1,h2,h3,.num,.cname,.price .v,.pline .v{font-weight:800;letter-spacing:0}
.panel,.btn,.mode,.pack,.zone,.bot,.front,.passbtn,.sheet,.post,.prod,.daily,.subject,.rank,.award,.item,.stats div,.ach div,.dev,.freebox,.resume,.duel,details.detail,.me,.lvl,.back,.cbar .mini,.tabs button,.x{border-color:transparent!important;box-shadow:var(--clay)!important}
.panel,.daily,.subject,.prod,.item,.award,.rank,details.detail,.freebox,.dev{border-radius:26px}
.btn{border-radius:22px}
.btn:active,.bidbtn:active,.passbtn:active,.pack:active,.mode:active,.back:active,.cbar .mini:active{box-shadow:var(--clay-in)!important;transform:translateY(2px) scale(.98)}
.btn.go{box-shadow:inset -5px -7px 10px rgba(0,0,0,.2), inset 4px 4px 8px rgba(255,255,255,.35), 4px 8px 14px rgba(70,45,20,.22)!important;font-size:20px}
.btn.soft{background:var(--accent-soft)}
.mode{border-radius:34px 28px 36px 30px}
.mode::after{background:rgba(255,255,255,.22)}
.pack{border-radius:24px 20px 26px 22px;background:var(--card)}
.pack::before{display:none}
.pack[aria-pressed="true"]{background:var(--accent-soft)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg{box-shadow:var(--clay-in);border-radius:18px}
.seg button{border-radius:14px}
.seg button[aria-pressed="true"]{box-shadow:var(--clay)}
input,textarea{border:0;box-shadow:var(--clay-in);border-radius:16px;background:var(--card)}
.tog{box-shadow:var(--clay-in)}
.tog::after{box-shadow:var(--clay)}
/* La carte en jeu : une galette de pâte colorée selon la rareté */
.front{background:color-mix(in srgb,var(--rc) 38%,var(--base))!important;border:0!important;border-radius:40px 34px 44px 36px!important;
  box-shadow:inset -10px -14px 20px rgba(0,0,0,.15), inset 10px 10px 18px rgba(255,255,255,.55), 8px 14px 24px rgba(70,45,20,.2)!important}
.front.gold{background:var(--goldcard)!important}
.front.leg::after,.front.gold::after{display:none}
.cname{color:var(--deep);text-shadow:2px 3px 0 rgba(255,255,255,.55),-1px -1px 0 rgba(0,0,0,.06)}
.pline .v,.price .v{color:var(--accent);text-shadow:3px 4px 0 rgba(0,0,0,.1),-2px -2px 0 rgba(255,255,255,.5)}
.rar,.stars{color:var(--deep)}
.rline .grp{color:var(--sub)}
.tag{box-shadow:var(--clay)}
.turnline,.soldline,.zst{border-radius:99px;box-shadow:inset -3px -4px 6px rgba(0,0,0,.18), inset 3px 3px 5px rgba(255,255,255,.35), 2px 4px 7px rgba(70,45,20,.15)}
.timer{box-shadow:var(--clay-in);background:var(--track);height:10px!important}
.timer i{border-radius:99px}
.cback{background:var(--accent)}
.bidbtn,.acts .bidbtn{border-radius:20px;box-shadow:inset -3px -5px 7px rgba(0,0,0,.2), inset 3px 3px 6px rgba(255,255,255,.4), 3px 5px 9px rgba(70,45,20,.18)!important}
.bidbtn:disabled{opacity:.35;box-shadow:var(--clay-in)!important}
.passbtn,.acts .passbtn{border-radius:20px;background:var(--card)}
.zone{border-radius:28px 24px 30px 26px;background:var(--card)}
.zone.turn{background:color-mix(in srgb,var(--tc) 16%,var(--card))!important;box-shadow:var(--clay),0 0 0 3px var(--tc)!important}
.bot{border-radius:20px;background:var(--card)}
.bot.turn{box-shadow:var(--clay),0 0 0 3px var(--tc)!important}
.chip{background:var(--chip);box-shadow:inset -2px -3px 4px rgba(0,0,0,.08), inset 2px 2px 3px rgba(255,255,255,.7)}
.coach{background:var(--deep);border-radius:18px}
.coach b{color:#FFD66B}
.dot{box-shadow:inset -2px -3px 4px rgba(0,0,0,.2), inset 2px 2px 3px rgba(255,255,255,.35)}
.lvl b{box-shadow:inset -2px -3px 4px rgba(0,0,0,.2), inset 2px 2px 3px rgba(255,255,255,.35)}
.bar{box-shadow:var(--clay-in);height:9px}
.logo .mark{text-shadow:3px 4px 0 rgba(0,0,0,.08),-2px -2px 0 rgba(255,255,255,.6)}
.rank.first{background:var(--first)!important}
.winner .big{color:var(--accent);text-shadow:3px 4px 0 rgba(0,0,0,.1)}
.toast{border-radius:18px;background:var(--ink)}
.sheet{border-radius:32px}

/* ===== Nouvelles ambiances (mêmes formes, autres couleurs) ===== */
html{background-attachment:fixed}
body{background-image:var(--bgimg,none);background-attachment:fixed;min-height:100vh}
:root[data-pal="vif"]{--bg:#F4F2FF;--bgimg:radial-gradient(circle at 12% 8%,#FFD6E0 0 120px,transparent 121px),radial-gradient(circle at 96% 30%,#D3E6FF 0 150px,transparent 151px),radial-gradient(circle at 6% 62%,#FFF1C2 0 90px,transparent 91px),radial-gradient(circle at 92% 82%,#E6DBFF 0 120px,transparent 121px),radial-gradient(circle at 10% 96%,#D8FFE9 0 130px,transparent 131px),radial-gradient(rgba(90,80,200,.07) 1.5px,transparent 2px) 0 0/22px 22px;--card:#FFFFFF;--soft:#EEECFB;--line:#E4E1FA;--ink:#1A1446;--mute:#6B6799;--accent:#FF3B5C;--accent-soft:#FFE1E7;--coral:#2D7BFF;--green:#00B874;--teal:#00B874;--amber:#FFB400;--blue:#2D7BFF;--r-leg:#FFB400;--gold-b:#FFB400;--chip:#F1F0FF;--track:#ECE9FF;--deep:#1A1446;--sub:#4D4880;--base:#FFFFFF;--goldcard:#FFE27A;--first:#FFF0B8}

:root[data-pal="luxe"] .front{--mute:#6E6250;--soft:#EDE5D2}
:root[data-pal="luxe"] .bidbtn[style*="--tc:var(--ink)"]{background:#5A4A30!important;color:#fff}

:root[data-pal="neon"] .coach,:root[data-pal="neon"] .resume,:root[data-pal="neon"] .toast{background:#2E2E6A!important;color:#fff}
:root[data-pal="luxe"] .tagline{color:#F5ECD6}
:root[data-pal="luxe"] .coach,:root[data-pal="luxe"] .resume,:root[data-pal="luxe"] .toast{background:#2A2A2A!important;color:#F5ECD6}
:root[data-pal="luxe"] .coach b{color:#D4A53A}

:root[data-pal="vif"] .front:not(.gold),:root[data-pal="bonbon"] .front:not(.gold),:root[data-pal="lagon"] .front:not(.gold),:root[data-pal="citron"] .front:not(.gold),:root[data-pal="coucher"] .front:not(.gold),:root[data-pal="stade"] .front:not(.gold){background:#FFFFFF!important;box-shadow:0 0 0 6px color-mix(in srgb,var(--rc) 75%,#fff),inset -8px -12px 18px rgba(40,30,120,.06),inset 8px 8px 14px rgba(255,255,255,.9),8px 14px 26px rgba(40,30,120,.18)!important}
:root[data-pal="vif"] .resume,:root[data-pal="bonbon"] .resume,:root[data-pal="lagon"] .resume,:root[data-pal="citron"] .resume,:root[data-pal="coucher"] .resume,:root[data-pal="stade"] .resume{background:linear-gradient(120deg,#FF3B5C,#FF7A45)!important;color:#fff}
:root[data-pal="vif"] .resume .pill,:root[data-pal="bonbon"] .resume .pill,:root[data-pal="lagon"] .resume .pill,:root[data-pal="citron"] .resume .pill,:root[data-pal="coucher"] .resume .pill,:root[data-pal="stade"] .resume .pill{background:rgba(255,255,255,.25);color:#fff}

:root[data-pal="bonbon"]{--bg:#FFF0F7;--bgimg:radial-gradient(circle at 12% 8%,#FFD3E6 0 120px,transparent 121px),radial-gradient(circle at 96% 30%,#FFE2CC 0 150px,transparent 151px),radial-gradient(circle at 6% 62%,#E6DDFF 0 90px,transparent 91px),radial-gradient(circle at 92% 82%,#FFD3E6 0 120px,transparent 121px),radial-gradient(circle at 10% 96%,#D9F6FF 0 130px,transparent 131px),radial-gradient(rgba(200,60,130,.07) 1.5px,transparent 2px) 0 0/22px 22px;--card:#FFFFFF;--soft:#FCEAF3;--line:#F6DCEA;--ink:#3A1236;--mute:#8A5C82;--accent:#FF3D8B;--accent-soft:#FFE0EE;--coral:#7B61FF;--green:#00BFA5;--teal:#00BFA5;--amber:#FFB020;--blue:#7B61FF;--r-leg:#FFB020;--gold-b:#FFB020;--chip:#FDEFF6;--track:#FBE6F1;--deep:#3A1236;--sub:#6E3F66;--base:#FFFFFF;--goldcard:#FFE27A;--first:#FFF0B8}
:root[data-pal="lagon"]{--bg:#EAFBFD;--bgimg:radial-gradient(circle at 12% 8%,#C9F3F7 0 120px,transparent 121px),radial-gradient(circle at 96% 30%,#D6E9FF 0 150px,transparent 151px),radial-gradient(circle at 6% 62%,#FFE6D1 0 90px,transparent 91px),radial-gradient(circle at 92% 82%,#C9F7E6 0 120px,transparent 121px),radial-gradient(circle at 10% 96%,#D6E9FF 0 130px,transparent 131px),radial-gradient(rgba(0,120,150,.07) 1.5px,transparent 2px) 0 0/22px 22px;--card:#FFFFFF;--soft:#E3F5F8;--line:#D3ECF1;--ink:#06303F;--mute:#4D7480;--accent:#FF6B3D;--accent-soft:#FFE4D9;--coral:#00A3D9;--green:#00BF8F;--teal:#00BF8F;--amber:#FFC21A;--blue:#00A3D9;--r-leg:#FFC21A;--gold-b:#FFC21A;--chip:#E9F7FA;--track:#E1F2F6;--deep:#06303F;--sub:#3D6470;--base:#FFFFFF;--goldcard:#FFE380;--first:#FFF2B3}
:root[data-pal="citron"]{--bg:#FFFCE8;--bgimg:radial-gradient(circle at 12% 8%,#FFF0A8 0 120px,transparent 121px),radial-gradient(circle at 96% 30%,#D9F7C4 0 150px,transparent 151px),radial-gradient(circle at 6% 62%,#FFDCC2 0 90px,transparent 91px),radial-gradient(circle at 92% 82%,#FFF0A8 0 120px,transparent 121px),radial-gradient(circle at 10% 96%,#CDEBFF 0 130px,transparent 131px),radial-gradient(rgba(150,120,0,.08) 1.5px,transparent 2px) 0 0/22px 22px;--card:#FFFFFF;--soft:#FBF6DC;--line:#F2EBC6;--ink:#2E2A0A;--mute:#77703F;--accent:#FF7A00;--accent-soft:#FFE7CC;--coral:#1E9BF0;--green:#34C04F;--teal:#34C04F;--amber:#F5B800;--blue:#1E9BF0;--r-leg:#F5B800;--gold-b:#F5B800;--chip:#FCF8E3;--track:#F8F2D6;--deep:#2E2A0A;--sub:#5E5830;--base:#FFFFFF;--goldcard:#FFE380;--first:#FFF2B3}

:root[data-pal="neon"] .front:not(.gold){background:#23235A!important;box-shadow:0 0 0 5px color-mix(in srgb,var(--rc) 80%,#000),0 0 22px color-mix(in srgb,var(--rc) 55%,transparent),inset -8px -12px 18px rgba(0,0,0,.35),8px 14px 26px rgba(0,0,0,.45)!important}
:root[data-pal="luxe"] .front:not(.gold){background:#F7F1E3!important;box-shadow:0 0 0 5px #D4A53A,inset -8px -12px 18px rgba(0,0,0,.08),8px 14px 26px rgba(0,0,0,.5)!important}
.pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.palbtn{border:0;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;font:800 15px var(--body);box-shadow:var(--clay)}
.palbtn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.palbtn .sw{display:flex;gap:5px}
.palbtn .sw i{width:22px;height:22px;border-radius:50%;box-shadow:inset -2px -3px 4px rgba(0,0,0,.2), inset 2px 2px 3px rgba(255,255,255,.4)}
.game>.stage.top{transform:rotate(180deg)}
@media (prefers-reduced-motion:no-preference){
  .game>.stage.toTop{animation:toTop .45s cubic-bezier(.3,.8,.3,1)}
  .game>.stage.toBottom{animation:toBottom .45s cubic-bezier(.3,.8,.3,1)}
  @keyframes toTop{from{transform:rotate(0)}to{transform:rotate(180deg)}}
  @keyframes toBottom{from{transform:rotate(180deg)}to{transform:rotate(360deg)}}
}

/* ===== À deux : écran partagé, chaque moitié tournée vers son joueur ===== */
.duo{gap:10px}
.duo .half{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.duo .half.top{transform:rotate(180deg)}
.duo .half>.stage{flex:1;min-height:0;display:flex}
.duo .front.dcard{padding:8px 12px 10px;gap:4px;justify-content:space-between;border-radius:30px 26px 32px 28px!important}
.duo .cbar{position:static;width:100%}
.duo .dmid{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;flex:1;justify-content:center;min-height:0}
.duo .dmain{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.duo .dmain .cname{min-width:0;font-size:clamp(19px,3.4vh,28px);line-height:1.05;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.duo .dmain .pline{flex:none}
.duo .pline .v{font-size:clamp(26px,4.8vh,38px)}
.duo .pline .who{font-size:12px}
.duo .dsub{font-size:12px;margin:0}
.duo .rline .grp{font-size:12px}
.duo .turnline{font-size:12px;padding:3px 12px}
.duo .turnline:not(.mine){background:var(--soft)!important;color:var(--mute)!important}
.duo .timer{max-width:none;width:92%;height:8px!important}
.duo .soldline{font-size:13px;padding:5px 12px}
.duo .nb{padding:10px;font-size:15px;margin:0;max-width:none}
.duo .zone{flex:none}
.duo .zone .roster{min-height:22px}

/* Résultats : révélation carte par carte */
.rc{opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .25s}
.rc.on{opacity:1;transform:none}
.rv{display:flex;gap:10px;align-items:baseline;flex:none}
.rv .force{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink);min-width:34px;text-align:right}
.tot{display:inline-block}
.big-again{display:flex;flex-direction:column;align-items:center;gap:0;padding:14px}
.big-again small{font-size:13px;font-weight:700;opacity:.85}
.bidbtn.off{opacity:.38}
.opts summary{display:flex;flex-direction:column;gap:2px;cursor:pointer;list-style:none}
.opts summary::-webkit-details-marker{display:none}
.opts summary small{font-size:13px;color:var(--mute);font-weight:700}
.opts summary b::after{content:"  ▾";color:var(--mute)}
.opts[open] summary b::after{content:"  ▴"}
.optin{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.vs p{margin:4px 0 0;font-size:14px}

.prime{position:fixed;inset:0;z-index:58;display:grid;place-items:center;background:rgba(40,25,10,.45);animation:pfade 2.6s ease forwards}
.prime.duo{grid-template-rows:1fr 1fr}
.prime .ph{display:grid;place-items:center}
.prime .ph.top{transform:rotate(180deg)}
.pbox{background:var(--goldcard);color:var(--deep);border-radius:40px 34px 44px 36px;padding:22px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:var(--clay),0 0 0 6px var(--tc);animation:ppop .5s cubic-bezier(.2,1.6,.4,1)}
.duo .pbox{padding:14px 28px}
.pbox .plbl{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.pbox b{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--accent);text-shadow:3px 4px 0 rgba(0,0,0,.12)}
.duo .pbox b{font-size:54px}
.pbox .pwho{font-weight:800;font-size:22px}
.pbox small{font-size:12px;font-weight:700;opacity:.75;max-width:220px}
@keyframes ppop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pfade{0%,82%{opacity:1}100%{opacity:0}}
.game .bot{position:relative;padding-bottom:14px!important}
.bpk{position:absolute;left:10px;right:10px;bottom:5px;display:flex;gap:3px}
.bpk i{flex:1;max-width:16px;height:5px;border-radius:99px;background:var(--soft);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.bpk i.f{background:var(--rc)}
.bill{display:inline-block;width:.95em;height:.56em;margin-left:.18em;vertical-align:.04em;border-radius:.12em;background:radial-gradient(circle at 50% 50%,#2F8A4A 0 .14em,transparent .15em),linear-gradient(#7FCF8A,#4FAE62);box-shadow:inset 0 0 0 .07em #2F8A4A,inset 0 0 0 .12em #A6E3AE,1px 1px 0 rgba(0,0,0,.18);transform:rotate(-8deg)}
.buy{border:0;border-radius:16px;padding:9px 14px;font:800 15px var(--display);background:var(--accent);color:#fff;flex:none;box-shadow:inset -2px -3px 5px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.35)}
.shopcat summary{display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;cursor:pointer}
.shopcat summary::-webkit-details-marker{display:none}
.shopcat summary small{font-size:12px;color:var(--mute);font-weight:700}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.plist .prod{padding:10px 12px}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;border-radius:20px;padding:14px 16px;background:var(--card);box-shadow:var(--clay);font:inherit;color:var(--ink)}
.offer span{display:flex;flex-direction:column;gap:2px;min-width:0}.offer small{font-size:12px;color:var(--mute)}
.offer.best{box-shadow:var(--clay),0 0 0 3px var(--accent)}
.offer .pr{font-family:var(--display);font-size:18px;color:var(--accent);flex:none}
.incl{max-height:110px;overflow:auto}

/* ===== Illustrations ===== */
.ic{width:1em;height:1em;display:block}
.cav{--a:var(--accent);flex:none;width:clamp(42px,7.5vh,60px);height:clamp(42px,7.5vh,60px);border-radius:46% 54% 50% 50%/52% 48% 52% 48%;display:grid;place-items:center;background:var(--a);color:#fff;font-size:clamp(26px,4.6vh,36px);box-shadow:inset -4px -6px 8px rgba(0,0,0,.2),inset 4px 4px 7px rgba(255,255,255,.4),3px 5px 9px rgba(70,45,20,.18);position:relative}
.cav .ic{color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.cav.big{width:68px;height:68px;font-size:42px}
.cav.sm{width:38px;height:38px;font-size:22px}
.cav.mys{background:var(--deep);font:800 26px var(--display);color:#fff}
.cav.sm.mys{font-size:18px}
.cav.shirtav{background:transparent;box-shadow:none;font-size:clamp(46px,8.5vh,64px);color:var(--a)}
.cav.shirtav .ic{color:var(--a);filter:drop-shadow(2px 4px 0 rgba(70,45,20,.18)) drop-shadow(inset 0 0 0 #000)}
.cav.shirtav::before{content:"";position:absolute;inset:38% 30% 18%;background:var(--b);opacity:.35;border-radius:4px}
.cav.shirtav b{position:absolute;inset:0;display:grid;place-items:center;padding-top:16%;font:800 clamp(13px,2.2vh,17px) var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cav.sm.shirtav{font-size:40px}.cav.sm.shirtav b{font-size:11px}
@media (max-height:600px){.game .cav:not(.sm){width:36px;height:36px;font-size:20px}.cav.shirtav{font-size:40px}}
.deco{display:flex;gap:10px;justify-content:center;margin-bottom:4px}
.deco span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--a);box-shadow:var(--clay);color:#fff}
.deco span .ic{color:#fff}
.deco span.nug{background:var(--card);font-size:30px}
@media (prefers-reduced-motion:no-preference){.deco span{animation:bob 2.4s var(--d) ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
 .wtro{animation:tro .7s cubic-bezier(.2,1.6,.4,1)}@keyframes tro{from{transform:scale(.2) rotate(-20deg)}}
 .pnug .ic{animation:bob 1.2s ease-in-out infinite}.pnug .ic:nth-child(2){animation-delay:.2s}.pnug .ic:nth-child(3){animation-delay:.4s}}
.mode .mic{position:absolute;right:14px;top:14px;font-size:46px;color:rgba(255,255,255,.9);filter:drop-shadow(0 3px 0 rgba(0,0,0,.12));z-index:1}
.drow{display:flex;align-items:center;gap:10px}
.pic{--a:var(--accent);flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--a);color:#fff;box-shadow:inset -2px -3px 4px rgba(0,0,0,.18),inset 2px 2px 3px rgba(255,255,255,.35)}
.pic .ic{color:#fff}
.pack .pic{margin-bottom:2px}
.prod{gap:12px}.prod .l{flex:1}
.wtro{display:block;width:84px;margin:0 auto 4px;font-size:84px;color:#F2B33D;filter:drop-shadow(3px 5px 0 rgba(70,45,20,.18))}
.pnug{display:flex;gap:2px;font-size:38px;margin-bottom:-4px}
.duo .dmain .cav.sm{width:34px;height:34px;font-size:20px}
.tagline{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em;color:var(--deep)}

.bst.say{font-style:italic;color:var(--ink)!important}
.homegrid .btn{flex-direction:column;gap:4px;padding:10px 4px;font-size:13px}
.homegrid .btn .ic{font-size:24px;color:var(--accent)}
.legal{align-self:center;font-size:12px}
.evbar{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#FFE08A,#FFC94D);color:#5A3B1E;border-radius:22px;padding:10px 14px;box-shadow:var(--clay)}

  const W=cv.width=innerWidth,H=cv.height=innerHeight;const cols=["#5B3DF5","#FF5A5F","#14B8A6","#F59E0B","#F5A524","#2E7CF6"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.3,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function fr(){cx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.33;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  if(++f<150)requestAnimationFrame(fr);else cx.clearRect(0,0,W,H)})()}

/* ---------- Hasard ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dstr(new Date())}
function dailyInfo(){const d=today();const ids=Object.keys(PACKS).filter(k=>PACKS[k].cards.length>=22);const h=cyrb53("daily|"+d);return{date:d,pack:ids[h%ids.length],seed:h%2147483647,chaos:(h>>>8)%2===0}}
const pickLine=a=>a[Math.floor(Math.random()*a.length)];

/* ===================== MOTEUR (enchères chacun son tour) ===================== */
let G=null, loopT=null, rnd=Math.random, SAY={};
function saveGame(){try{if(G)localStorage.setItem("mmax_game",JSON.stringify(G));else localStorage.removeItem("mmax_game")}catch(e){}}
function loadGame(){try{const g=JSON.parse(localStorage.getItem("mmax_game"));if(g&&g.v===6&&g.teams&&["draw","auction","sold"].includes(g.phase)&&getPack(g.pack))return g}catch(e){}return null}
function packOf(){return getPack(G.pack)}
function cardOf(i){return packOf().cards[i]}
function full(t){return t.picks.length>=G.s.slots}
function maxBid(t){const need=G.s.slots-t.picks.length;return need<=0?-1:t.money-10*(need-1)}
function isOver(){return G.teams.every(full)||G.pos>=G.order.length}
function canRaise(ti,inc=10){const t=G.teams[ti];return !full(t)&&!G.cur.out[ti]&&G.cur.price+inc<=maxBid(t)}

function startGame(s,mode,daily){
  LASTFACE=0;
  const pack=getPack(s.pack),fm=FORMATS[s.format];
  const seed=daily?daily.seed:Math.floor(Math.random()*2147483647);
  rnd=mulberry(seed);
  const teams=mode==="amis"?s.names.map((n,i)=>({name:n.trim()||("Joueur "+(i+1)),ai:false})):[{name:"Toi",ai:false}].concat(shuffle(BOTS.slice(),mulberry(seed^0x5bd1)).slice(0,s.nai===1?1:2).map(b=>({name:b.n,ai:true,pers:b.pers})));
  G={v:6,mode,pack:s.pack,order:shuffle(pack.cards.map((_,i)=>i),rnd),pos:0,seed,daily:daily?daily.date:null,next:0,
    s:{diff:s.diff||"normal",budget:fm.budget,slots:fm.slots,chaos:!!s.chaos,ms:(TEMPO[s.tempo]||TEMPO.lent).ms},
    teams:teams.map(t=>Object.assign(t,{money:fm.budget,picks:[]})),cur:null,phase:"draw",event:null};
  SAY={};saveGame();go("game");
}
function draw(){
  if(isOver()){finish();return}
  G.event=null;G.prime=-1;
  let golden=false,mystery=false;
  if(G.s.chaos){const r=rnd();
    const ev=eventNow(),gr=ev?ev.gold:.12,mr=ev?ev.mys:.10;
    if(r<gr)golden=true;else if(r<gr+mr)mystery=true;
    /* Prime : rare (environ 3 % par carte, 2 par partie au plus), montant au hasard, et parfois aucune de toute la partie */
    G.nPrime=G.nPrime||0;
    if(G.pos>0&&G.nPrime<2&&rnd()<.03){const c=G.teams.filter(t=>!full(t));
      if(c.length){const mx=Math.max(...c.map(t=>t.money)),w=c.map(t=>1+(mx-t.money)/100),tot=w.reduce((a,b)=>a+b,0);
        let x=rnd()*tot,k=0;while(k<c.length-1&&(x-=w[k])>0)k++;const t=c[k];
        const q=rnd(),amt=q<.35?10:q<.65?20:q<.80?30:q<.92?50:q<.98?80:100;
        t.money+=amt;G.nPrime++;G.prime=G.teams.indexOf(t);G.primeAmt=amt;G.event=`Prime surprise : ${t.name} reçoit +${PT(amt)}`}}}
  const i=G.order[G.pos++],n=G.teams.length,starter=G.next%n;G.next=(starter+1)%n;
  G.cur={i,price:0,leader:-1,golden,mystery,out:{},max:{},turn:-1,starter,turnEnd:0,aiAt:0};
  computeAI();G.phase="auction";
  setTurn(starter,true);
  if(G.phase!=="auction")return;
  if(G.prime>=0){G.cur.aiAt&&(G.cur.aiAt+=2600);G.cur.turnEnd&&(G.cur.turnEnd+=2600)}
  saveGame();render();
  if(G.prime>=0)primeFx(G.prime);
  const c=cardOf(i);if(!RM)$$(".card").forEach(el=>el.classList.add("flipin"));
  if(golden){setTimeout(()=>{SFX.leg();buzz([40,30,40])},300)}else SFX.flip();
}
/* Donne la main au prochain joueur qui peut encore surenchérir ; sinon la vente se termine. */
function setTurn(from,includeFrom){
  const n=G.teams.length;
  for(let k=includeFrom?0:1;k<=n;k++){const ti=(from+k)%n;
    if(ti===G.cur.leader)continue;
    if(G.cur.out[ti])continue;
    if(!canRaise(ti)){G.cur.out[ti]=1;continue}
    G.cur.turn=ti;
    G.cur.turnEnd=G.s.ms?Date.now()+G.s.ms:0;
    G.cur.aiAt=G.teams[ti].ai?Date.now()+700+Math.random()*700:0;
    if(G.mode==="solo"&&!G.teams[ti].ai)buzz(70);
    return;
  }
  sell();
}
function estimate(card){const d=DIFF[G.s.diff];let base=card.p;if(G.cur.mystery)base={leg:95,epic:88,rare:80,com:58}[RAR(card.p).k];return base+(rnd()*2-1)*d.noise}
function computeAI(){
  const c=cardOf(G.cur.i),left=G.order.length-G.pos;
  G.teams.forEach((t,ti)=>{
    if(!t.ai||full(t)){G.cur.max[ti]=-1;return}
    const need=G.s.slots-t.picks.length,est=estimate(c),avg=G.s.budget/G.s.slots;
    let v=avg*Math.pow(Math.max(0,(est-40)/45),1.6)*1.2;
    v*={requin:est>=88?1.3:.85,flambeur:1.25,prudent:.85}[t.pers]||1;
    /* Les ordis dépensent leur budget : plus il leur reste d'argent par place libre, plus ils misent fort */
    const rich=(t.money/need)/avg;v*=Math.max(.85,Math.min(2.4,Math.pow(rich,1.15)));
    if(need===1)v=Math.max(v,t.money*(est>=85?.95:est>=75?.75:.5));
    if(left<need*1.6)v*=1.45;
    if(G.cur.golden)v*=1.4;
    if(G.s.diff==="facile")v*=.85+rnd()*.5;
    G.cur.max[ti]=Math.floor(Math.min(v,maxBid(t)));
  });
}
function say(ti,kind){const t=G.teams[ti];if(!t||!t.ai)return;SAY[ti]={text:pickLine(LINES[t.pers][kind]),until:Date.now()+2200}}
function raise(ti,inc){
  if(!G||G.phase!=="auction"||G.cur.turn!==ti)return;
  const t=G.teams[ti];
  if(!canRaise(ti,inc)){if(!t.ai){SFX.nope();{const need=G.s.slots-t.picks.length;toast(`${G.mode==="solo"?"Tu peux":t.name+" peut"} miser jusqu'à ${PT(Math.max(0,maxBid(t)))} : il faut garder 10 💵 pour ${need>2?"chacune des "+(need-1)+" autres recrues":"la dernière recrue"}.`)}}return}
  G.cur.price+=inc;G.cur.leader=ti;
  SFX.bid();if(!t.ai)buzz(15);else if(Math.random()<.5)say(ti,"bid");
  setTurn(ti,false);
  if(G.phase==="auction"){saveGame();render();bumpPrice()}
}
function pass(ti){
  if(!G||G.phase!=="auction"||G.cur.turn!==ti)return;
  if(G.cur.leader<0&&canRaise(ti,10)){if(!G.teams[ti].ai){SFX.nope();toast("Personne n'a encore misé : la première mise est obligatoire.")}return}
  G.cur.out[ti]=1;
  if(G.teams[ti].ai&&Math.random()<.6)say(ti,"out");
  setTurn(ti,false);
  if(G.phase==="auction"){saveGame();render()}
}
function aiTurn(ti){
  const mx=G.cur.max[ti],p=G.cur.price,t=G.teams[ti];
  if(G.cur.leader<0&&canRaise(ti,10)&&mx<p+10){raise(ti,10);return}
  if(mx>=p+10&&canRaise(ti)){const gap=mx-p;let inc;
    if(p===0)inc=Math.max(10,Math.round(mx*(.35+Math.random()*.3)/10)*10);
    else inc=gap>=180&&Math.random()<.6?100:gap>=70&&Math.random()<.7?50:10;
    while(inc>10&&!canRaise(ti,inc))inc=inc>50?50:10;
    raise(ti,inc)}
  else pass(ti);
}
function primeFx(ti){const t=G.teams[ti],duo=G.mode==="amis"&&G.teams.length===2,me=G.mode==="solo"&&ti===0;

let skipFn=null;
function playReveal(){
  const R=LAST;if(!R)return;
  const teams=[...document.querySelectorAll("[data-step]")];let ended=false;
  teams.forEach(el=>{const t=el.querySelector(".tot");if(t)t.textContent="0 pts";});
  const steps=[];teams.forEach(el=>{const rows=[...el.querySelectorAll(".rc")];steps.push({el,row:null});rows.forEach(row=>steps.push({el,row}))});
  const run={},shown=new Set();
  const show=i=>{if(shown.has(i))return;shown.add(i);const st=steps[i];if(!st)return;st.el.classList.add("on");
    if(st.row){st.row.classList.add("on");const t=st.el.querySelector(".tot");run[st.el.dataset.step]=(run[st.el.dataset.step]||0)+(+st.row.dataset.add);
      if(t){t.textContent=run[st.el.dataset.step]+" pts";t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump")}
      SFX.hit();if(+st.row.dataset.add>=93)setTimeout(()=>SFX.leg&&SFX.leg(),60)}};
  const fin=()=>teams.forEach(el=>{const t=el.querySelector(".tot");if(t)t.textContent=t.dataset.total+" pts";el.querySelectorAll(".rc").forEach(r=>r.classList.add("on"));el.classList.add("on")});
  const end=()=>{if(ended)return;ended=true;const w=$("#winner"),a=$("#after"),s=$("#skip");if(w)w.classList.add("on");if(a)a.classList.add("on");if(s)s.hidden=true;
    if(R.win||R.mode==="amis"){SFX.win();confetti(180)}};
  skipFn=()=>{clearTimers();fin();end()};
  if(RM){skipFn();return}
  let t=400;steps.forEach((st,i)=>{t+=st.row?650:500;timers.push(setTimeout(()=>{show(i);const tgt=st.row||st.el;if(tgt.scrollIntoView)tgt.scrollIntoView({block:"nearest",behavior:"smooth"})},t))});
  timers.push(setTimeout(()=>{fin();end();const w=$("#winner");if(w&&w.scrollIntoView)w.scrollIntoView({block:"start",behavior:"smooth"})},t+700));
}

/* ---------- Image du résultat, à partager ---------- */
function resultCanvas(){
  const R=LAST,cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim()||"#333";
  const W=1080,rowH=54,H=420+R.ranked.reduce((a,r)=>a+120+Math.max(1,r.rows.length)*rowH,0)+150;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const font=(w,sz)=>`${w} ${sz}px ${cs.getPropertyValue("--display")||"sans-serif"}`;
  const col=ti=>{const m=COL[ti].match(/var\((--[\w-]+)\)/);return m?v(m[1]):COL[ti]};
  const rr=(X,Y,w,h,r,f)=>{x.beginPath();x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h);x.fillStyle=f;x.fill()};
  x.fillStyle=v("--bg");x.fillRect(0,0,W,H);
  x.fillStyle=v("--ink");x.font=font(800,84);x.fillText("Mercato Max",70,140);
  x.fillStyle=v("--mute");x.font=font(700,38);x.fillText(R.packName+(R.daily?" · Défi du jour":""),70,200);
  const top=R.ranked[0];x.fillStyle=v("--accent");x.font=font(800,64);
  x.fillText(R.tie?"Égalité !":R.mode==="solo"?(R.win?"J'ai gagné !":top.t.name+" gagne"):top.t.name+" gagne !",70,300);
  let y=360;
  R.ranked.forEach((r,k)=>{const h=100+Math.max(1,r.rows.length)*rowH;rr(60,y,W-120,h,36,v("--card"));
    x.fillStyle=col(r.ti);x.font=font(800,44);x.fillText((k+1)+". "+r.t.name,100,y+66);
    x.textAlign="right";x.fillStyle=v("--ink");x.fillText(r.total+" pts",W-100,y+66);x.textAlign="left";
    x.font=font(600,34);r.rows.forEach((q,j)=>{const yy=y+120+j*rowH;x.fillStyle=v("--ink");x.fillText(q.c.n+(q.k.golden?" (or)":""),100,yy);
      x.textAlign="right";x.fillStyle=v("--mute");x.fillText(q.p+" pts · "+PT(q.k.price),W-100,yy);x.textAlign="left"});
    if(!r.rows.length){x.fillStyle=v("--mute");x.fillText("Aucune recrue",100,y+120)}
    y+=h+28});
  x.fillStyle=v("--ink");x.font=font(800,40);x.fillText("Tu fais mieux ? Joue à Mercato Max",70,H-70);
  return cv;
}

    <p class="mute" style="font-size:13px">Il faut au moins 6 cartes. Plus il y en a, plus les parties sont variées.</p>
    <div class="err" id="ederr"></div>
    <button class="btn go green" data-act="edSave">Enregistrer</button>${EDIT.id?`<button class="btn" data-act="edDel">Supprimer ce pack</button>`:""}`;
  const mine=(P.custom||[]).map(c=>`<div class="item"><span class="l"><b>${esc(c.name)}</b><small>${c.cards.length} cartes</small></span><span class="row"><button class="back" data-act="edOpen" data-v="${c.id}">Modifier</button><button class="back" data-act="playCustom" data-v="${c.id}">Jouer</button></span></div>`).join("");
  return `<div class="topbar"><button class="back" data-act="go" data-v="home">Retour</button><h2>Mes packs</h2></div>
  <p class="mute">Crée ton propre pack : ton équipe de quartier, les profs du lycée, ta série préférée… ${persoMax()===Infinity?"Packs illimités.":`${(P.custom||[]).length}/${persoMax()} packs utilisés. Plus de place avec la boutique.`}</p>
  ${canCreate()?`<button class="btn go" data-act="edNew">+ Nouveau pack</button>`:`<button class="btn go" data-act="persoOffers">Plus de place pour mes packs</button>`}${mine}`;
}
function parseCards(txt){const out=[],bad=[];txt.split("\n").map(s=>s.trim()).filter(Boolean).forEach((l,i)=>{const a=l.split(/[;|]/).map(s=>s.trim());const p=Math.round(+a[2]);
  if(a[0]&&a[1]&&p>=1&&p<=100)out.push({n:a[0].slice(0,40),g:a[1].slice(0,30),p});else bad.push(i+1)});return{out,bad}}

function startDaily(){const D=dailyInfo();startGame({pack:D.pack,nai:2,diff:"normal",format:"normal",tempo:"lent",chaos:D.chaos},"solo",D)}

/* ===================== ACTIONS ===================== */
function act(a,v,i,b){
  switch(a){
    case"go":go(v);break;
    case"closeSheet":closeSheet();break;
    case"rules":sheet(rulesHTML());break;
    case"colors":palSheet();break;
    case"pal":P.pal=v;saveP();applyPal();palSheet();break;
    case"sound":P.sound=!P.sound;saveP();render();break;
    case"mode":MODE=v;ST=null;OPTOPEN=false;go("setup");break;
    case"playWeek":MODE="solo";ST=Object.assign(defaultSetup("solo"),P.solo||{},{pack:weekFree()});go("setup");break;
    case"resume":G=loadGame();if(G){rnd=mulberry(G.seed+G.pos);SAY={};if(G.phase==="auction"){G.cur.turnEnd=G.s.ms?Date.now()+G.s.ms:0;G.cur.aiAt=G.teams[G.cur.turn].ai?Date.now()+1200:0}go("game")}break;
    case"daily":startDaily();break;
    case"cat":SEL.cat=v;render();break;
    case"pickPack":if(!packOpen(v)){lockedSheet(v);break}if(!ST)ST=Object.assign(defaultSetup(MODE),P[MODE]||{});ST.pack=v;go("setup");break;
    case"opt":{const k=b.dataset.k;ST[k]=isNaN(+v)?v:+v;render();break}
    case"tog":ST[b.dataset.k]=!ST[b.dataset.k];render();break;
    case"addP":ST.names.push("Joueur "+(ST.names.length+1));render();break;
    case"rmP":ST.names.splice(i,1);render();break;
    case"start":P[MODE]=ST;saveP();SERIES=null;startGame(ST,MODE,null);break;
    case"draw":if(!G||G.phase==="place"||G.phase==="auction")break;if(G.phase==="sold"&&isOver())finish();else draw();break;
    case"raise":raise(i,+v);break;
    case"botTeam":{if(!G)break;const t=G.teams[i];sheet(`<span class="lbl" style="color:${COL[i]}">Équipe</span><h2>${esc(t.name)}</h2><p class="mute">${PT(t.money)} restants · ${t.picks.length}/${G.s.slots} recrues</p><div class="lineup">${t.picks.map(k=>{const c=cardOf(k.i);return `<div><span>${k.golden?"En or":esc(c.g||"")}</span><b>${esc(c.n)}</b><span class="mute">${PT(k.price)}</span></div>`}).join("")||"<div><span>Aucune recrue pour l'instant</span></div>"}</div><button class="btn" data-act="closeSheet">Fermer</button>`);break}
    case"pass":pass(i);break;
    case"quit":stopLoop();sheet(`<h2>Pause</h2><p class="mute">La partie est sauvegardée. Tu pourras la reprendre depuis l'accueil.</p><button class="btn go" data-act="resumeNow">Continuer</button><button class="btn" data-act="rules">Revoir les règles</button><button class="btn" data-act="quitYes">Retour à l'accueil</button>`,false);break;
    case"resumeNow":closeSheet();if(G&&G.phase==="auction"){G.cur.turnEnd=G.s.ms?Date.now()+G.s.ms:0;if(G.teams[G.cur.turn].ai)G.cur.aiAt=Date.now()+900;startLoop()}break;
    case"quitYes":saveGame();G=null;go("home");break;
    case"skip":skipFn&&skipFn();break;
    case"again":if(LAST.daily)startDaily();else{const s=Object.assign(defaultSetup(LAST.mode),P[LAST.mode]||{});MODE=LAST.mode;startGame(s,LAST.mode,null)}break;
    case"newSubject":MODE=LAST.mode;ST=Object.assign(defaultSetup(MODE),P[MODE]||{});go("picker");break;
    case"share":copy(v);break;
    case"shareImg":shareImg();break;
    case"saveImg":saveImg();break;
    case"copyDev":copy(P.device);break;
    case"buy":if(owns(v))break;buySheet(v);break;
    case"pay":closeSheet();PAY.buy(v);break;
    case"activate":{const k=$("#key").value,p=checkKey(k),er=$("#kerr");
      if(!k.trim()){er.textContent="Colle d'abord le code reçu.";break}
      if(!p){er.textContent="Ce code ne correspond pas à ce téléphone. Vérifie chaque lettre, ou renvoie-nous ton identifiant.";break}
      P.owned[p]=true;saveP();toast(PRODUCTS[p].label+" : débloqué !");SFX.win();render();confetti(180);break}
    case"persoOffers":sheet(`<span class="lbl">Packs perso</span><h2>Crée plus de packs</h2><p class="mute">${persoMax()>1?`Tu as utilisé tes ${persoMax()} places.`:"Tu as utilisé ta place gratuite."} Choisis une offre :</p><div class="offers">${["perso3","perso10","createur"].filter(k=>!owns(k)).map(k=>`<button class="offer ${k==="perso10"?"best":""}" data-act="buy" data-v="${k}"><span><b>${esc(PRODUCTS[k].label)}</b><small>${esc(PRODUCTS[k].desc)}</small></span><b class="pr">${euro(PRODUCTS[k].cents)}</b></button>`).join("")}</div><button class="btn" data-act="closeSheet">Plus tard</button>`);break;
    case"edNew":if(!canCreate()){go("shop");break}EDIT={id:null,name:"",rows:[{n:"",p:""},{n:"",p:""},{n:"",p:""},{n:"",p:""},{n:"",p:""},{n:"",p:""}]};render();break;
    case"edOpen":{const c=P.custom.find(x=>x.id===v);EDIT={id:c.id,name:c.name,rows:c.cards.map(k=>({n:k.n,p:String(k.p)}))};render();break}
    case"edAdd":EDIT.rows.push({n:"",p:""});render();{const el=$("#edn"+(EDIT.rows.length-1));if(el)el.focus()}break;
    case"edRm":EDIT.rows.splice(i,1);if(!EDIT.rows.length)EDIT.rows.push({n:"",p:""});render();break;
    case"edCancel":EDIT=null;render();break;
    case"edSave":{const name=(EDIT.name||"").trim(),er=$("#ederr"),out=[],bad=[];
      EDIT.rows.forEach((r,k)=>{const n=r.n.trim(),p=Math.round(+r.p);if(!n&&!String(r.p).trim())return;if(!n||!(p>=1&&p<=100))bad.push(k+1);else out.push({n:n.slice(0,40),g:"",p})});
      if(!name){er.textContent="Donne un nom à ton pack.";break}
      if(bad.length){er.textContent="À corriger, ligne"+(bad.length>1?"s ":" ")+bad.join(", ")+" : il faut un nom et une force entre 1 et 100.";break}
      if(out.length<6){er.textContent="Il faut au moins 6 cartes ("+out.length+" pour l'instant).";break}
      if(EDIT.id){const c=P.custom.find(x=>x.id===EDIT.id);c.name=name;c.cards=out}else P.custom.push({id:"c_"+Date.now().toString(36),name,cards:out});
      saveP();EDIT=null;toast("Pack enregistré !");render();break}
    case"edDel":sheet(`<h3>Supprimer ce pack ?</h3><button class="btn go coral" data-act="edDelYes">Supprimer</button><button class="btn" data-act="closeSheet">Annuler</button>`);break;
    case"edDelYes":P.custom=P.custom.filter(x=>x.id!==EDIT.id);saveP();EDIT=null;closeSheet();render();break;
    case"playCustom":MODE="solo";ST=Object.assign(defaultSetup("solo"),P.solo||{},{pack:v});go("setup");break;
  }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;act(b.dataset.act,b.dataset.v,+b.dataset.i,b)});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="opts")OPTOPEN=e.target.open},true);
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset||!t.dataset.inp)return;
  if(t.dataset.inp==="pname")ST.names[+t.dataset.i]=t.value;
  if(EDIT&&t.dataset.inp==="edname")EDIT.name=t.value;
  if(EDIT&&t.dataset.inp==="edn")EDIT.rows[+t.dataset.i].n=t.value;
  if(EDIT&&t.dataset.inp==="edp"){t.value=t.value.replace(/[^0-9]/g,"").slice(0,3);EDIT.rows[+t.dataset.i].p=t.value}
  if(t.dataset.inp==="q"){SEL.q=t.value;const pos=t.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(pos,pos)}}
});

render();
PAY.back();
</script>

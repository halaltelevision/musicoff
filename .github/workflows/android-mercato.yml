# Construit l'appli Android de Mercato Max Foot.
# - Toujours : un APK de test (à installer sur un téléphone).
# - Si les secrets MMF_KEYSTORE_BASE64 et MMF_KEYSTORE_PASSWORD existent : le fichier .aab signé à envoyer sur la Play Console.
# Les fichiers se téléchargent en bas de la page de chaque construction (onglet Actions de GitHub), rubrique « Artifacts ».
name: Appli Android Mercato Max Foot
on:
  workflow_dispatch:
  push:
    paths:
      - "mercato-max-foot/**"
      - ".github/workflows/android-mercato.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercato-max-foot/appli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le jeu
        run: |
          npm ci
          node copier-jeu.mjs
          npx cap sync android
      - name: Clé d'envoi
        env:
          KEY_B64: ${{ secrets.MMF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cle-envoi.jks"; echo "MMF_KEYSTORE=$RUNNER_TEMP/cle-envoi.jks" >> "$GITHUB_ENV"; echo "Clé d'envoi trouvée : .aab signé"; else echo "Pas de clé d'envoi : APK de test seulement"; fi
      - name: Construire
        working-directory: mercato-max-foot/appli/android
        env:
          MMF_KEYSTORE_PASSWORD: ${{ secrets.MMF_KEYSTORE_PASSWORD }}
          MMF_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$MMF_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: APK de test
        uses: actions/upload-artifact@v4
        with:
          name: mercato-max-foot-apk-${{ github.run_number }}
          path: mercato-max-foot/appli/android/app/build/outputs/apk/**/*.apk
      - name: Fichier pour la Play Console (.aab)
        if: env.MMF_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: mercato-max-foot-playstore-${{ github.run_number }}
          path: mercato-max-foot/appli/android/app/build/outputs/bundle/release/*.aab

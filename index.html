<script>

 en: {title:"MusicOff Studio – Your videos, without the music",
  badge:"Free · Windows 10 and 11", h1:"Your videos,<br><span>without the music.</span>",

  cta:"Download for free", meta:"<b>1 hour free</b> on day one, then 30 min every day",

 ar: {title:"MusicOff Studio – فيديوهاتك بدون موسيقى",
  badge:"مجاني · Windows 10 و11", h1:"فيديوهاتك،<br><span>بدون موسيقى.</span>",
  lead:"يحذف MusicOff Studio الموسيقى من فيديوهاتك ويحافظ على الأصوات والمؤثرات الصوتية. على يوتيوب وفيسبوك وإنستغرام وتيك توك وفيديوهات حاسوبك.",
  cta:"تحميل مجاني", meta:"<b>ساعة مجانية</b> في اليوم الأول، ثم 30 دقيقة كل يوم",
  after:"بدأ التحميل. افتح الملف لتثبيت MusicOff Studio.<br>إذا ظهرت رسالة «لقد قام Windows بحماية جهاز الكمبيوتر»، انقر على «مزيد من المعلومات» ثم «التشغيل على أي حال».",

};
const ARAB_TZ = ["Africa/Algiers","Africa/Casablanca","Africa/El_Aaiun","Africa/Tunis","Africa/Tripoli","Africa/Cairo","Africa/Khartoum",

 "Asia/Bahrain","Asia/Muscat","Asia/Aden","Asia/Baghdad","Asia/Amman","Asia/Beirut","Asia/Damascus","Asia/Gaza","Asia/Hebron"];
const FR_TZ = ["Europe/Paris","Europe/Brussels","Europe/Luxembourg","Europe/Monaco","Europe/Zurich","Africa/Dakar","Africa/Abidjan",
 "Africa/Bamako","Africa/Ouagadougou","Africa/Niamey","Africa/Lome","Africa/Porto-Novo","Africa/Conakry","Africa/Douala",
 "Africa/Libreville","Africa/Brazzaville","Africa/Kinshasa","Africa/Lubumbashi","Africa/Bangui","Africa/Ndjamena","Africa/Kigali",
 "Africa/Bujumbura","Indian/Antananarivo","Indian/Reunion","Indian/Mayotte","America/Port-au-Prince","America/Guadeloupe",
 "America/Martinique","America/Cayenne","Pacific/Noumea","Pacific/Tahiti"];
function pick(){
  const q = new URLSearchParams(location.search).get("lang");
  if (T[q]) return q;
  const nav = (navigator.languages && navigator.languages[0] || navigator.language || "en").slice(0,2).toLowerCase();
  let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e) {}
  if (nav === "ar" || ARAB_TZ.includes(tz)) return "ar";
  if (FR_TZ.includes(tz) || nav === "fr") return "fr";
  return "en";
}
let L = pick();
function apply(){
  const t = T[L];
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t[e.dataset.t]; });
  document.querySelectorAll(".langs a").forEach(a => a.classList.toggle("on", a.dataset.l === L));
}
document.querySelectorAll(".langs a").forEach(a => a.addEventListener("click", ev => {
  ev.preventDefault(); L = a.dataset.l; apply(); history.replaceState(null, "", "?lang=" + L);
}));
const ua = navigator.userAgent;
const notPC = /Android|iPhone|iPad|iPod|Mobile|Macintosh|CrOS/i.test(ua) && !/Windows/i.test(ua);
document.getElementById("dl").addEventListener("click", ev => {
  if (notPC) { ev.preventDefault(); document.getElementById("mobile").classList.add("show"); return; }
  document.getElementById("after").classList.add("show");
});
document.getElementById("copy").addEventListener("click", async () => {
  const url = location.origin + location.pathname;
  try { await navigator.clipboard.writeText(url); } catch(e) { prompt("", url); }
  document.getElementById("copy").textContent = T[L].copied;
});
apply();
</script>

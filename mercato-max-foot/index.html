<title>Mercato Max Foot</title>
<meta name="description" content="Mercato Max Foot : Mise. Bluffe. Recrute. Construis l'équipe de tes rêves aux enchères, seul ou entre amis.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout : un seul écran façon soir de match — bandeau des adversaires, carte joueur sous les projecteurs, tableau LED de la mise, ton terrain en bas */
:root{
  --bg:#0A1430;--card:#111F48;--soft:#1B2C5E;--line:#253A75;--ink:#EEF3FF;--mute:#93A3D1;
  --red:#FF4563;--blue:#3D8BFF;--yellow:#FFC93C;--green:#18D17E;--violet:#8B6BFF;
  --accent:var(--red);--accent-soft:#3A1F3D;--grass:#0F7A45;--grass2:#108350;--board:#050A18;--boardtxt:#FFD84A;
  --bgimg:radial-gradient(ellipse 60% 40% at 10% -5%,rgba(160,200,255,.32),transparent 70%),radial-gradient(ellipse 60% 40% at 90% -5%,rgba(160,200,255,.32),transparent 70%);
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --led:"Chakra Petch","Saira Condensed",monospace;
  --press:0 6px 16px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 15px/1.4 var(--body);background-image:var(--bgimg);background-attachment:fixed;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;-webkit-tap-highlight-color:transparent}
body.ingame{padding-block:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-size:28px}
p{margin:0}
.mute{color:var(--mute)}
.app{max-width:460px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:12px}
.lbl{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.bill{display:inline-block;width:.95em;height:.56em;margin-left:.22em;vertical-align:.06em;border-radius:.1em;background:radial-gradient(circle at 50% 50%,#2F8A4A 0 .13em,transparent .14em),linear-gradient(#7FCF8A,#4FAE62);box-shadow:inset 0 0 0 .07em #2F8A4A}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.btn{border-radius:12px;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s}
.btn.go{background:var(--accent);border-color:transparent;color:#fff;font-size:22px;padding:13px;box-shadow:var(--press)}
.btn.blue{background:var(--blue);border-color:transparent;color:#fff;box-shadow:var(--press)}
.btn:active,.bid:active,.opt:active,.mode:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{border-radius:9px;padding:5px 11px;font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--card);border:1px solid var(--line);color:var(--mute)}

/* Accueil */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.logo svg{width:84px;height:95px}
.mark{font-family:var(--display);font-size:50px;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.mark span{color:var(--accent)}
.mark em{font-style:normal;display:inline-block;background:var(--green);color:#fff;font-size:22px;line-height:1;padding:4px 9px 3px;border-radius:6px;vertical-align:middle;transform:translateY(-6px) rotate(-3deg);letter-spacing:.06em}
.tagline{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:14px;min-height:138px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;position:relative;overflow:hidden;box-shadow:var(--press)}
.mode::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.18) 49.5% 50.5%,transparent 50.5%),radial-gradient(circle at 50% 50%,transparent 26px,rgba(255,255,255,.18) 27px 28px,transparent 29px);pointer-events:none}
.mode b{font-family:var(--display);font-size:30px;line-height:.95;text-transform:uppercase;position:relative}
.mode small{font-size:13px;font-weight:600;opacity:.95;line-height:1.25;position:relative}
.mode .ico{position:relative;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px;align-self:flex-start}
.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.proto{text-align:center;font-size:12px}

/* Préparation */
.topbar{display:flex;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.seg{display:flex;gap:3px;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border-radius:9px;padding:7px 4px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--mute);line-height:1.1}
.seg button small{display:block;font-family:var(--body);text-transform:none;font-size:11px;font-weight:600;opacity:.85}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,51,.18)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border-radius:12px;padding:9px 6px 8px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;position:relative;min-width:0}
.opt b{font-family:var(--display);font-size:18px;line-height:1.05;text-transform:uppercase}
.opt small{font-size:11px;color:var(--mute);line-height:1.2}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.5}
.opt .soon{position:absolute;top:-8px;right:-3px;background:var(--yellow);color:#141433;font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;border-radius:5px;padding:0 6px}
.fm{display:flex;gap:2px;margin-bottom:3px}
.fm i{width:7px;height:7px;border-radius:2px;background:var(--pc)}
input{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:5px;align-items:center}.nrow .dot{width:22px;height:22px;font-size:13px}.nrow input{padding:8px}.nrow .x{width:26px;height:34px}.nrow>span:empty{display:none}
.dot{width:26px;height:26px;border-radius:7px;background:var(--tc);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.x{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--mute);font-size:18px}

/* Terrain */
.jer{display:block}
.pitch{position:relative;border-radius:12px;padding:6px 6px 5px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;overflow:hidden;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.55) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,var(--grass) 0 10%,var(--grass2) 10% 20%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border:2px solid rgba(255,255,255,.5);border-radius:50%}
.pitch::after{content:"";position:absolute;left:0;top:26%;bottom:26%;width:20px;border:2px solid rgba(255,255,255,.5);border-left:0}
.slot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.pitch{grid-template-columns:repeat(var(--cols,5),minmax(0,1fr))}
.pitch.xi{gap:0 2px;padding:4px 4px 3px}
.pitch.xi .line{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-around;gap:1px;min-width:0}
.pitch.xi .slot .ph{width:22px;height:22px;font-size:9px;margin:1px 0}
.pitch.xi .slot .sp{display:none}
.pitch.xi .slot .sn{font-size:10px;line-height:1.05}
.pitch.xi .slot .sv{font-size:11px;padding:0 4px;line-height:1.25}
.pitch.xi.sm .slot .sn{display:none}.pitch.xi.sm .slot .ph{width:16px;height:16px;font-size:7px;border-width:1.5px}
.xstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:4px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;text-align:left}
.xstrip .xc{display:flex;flex-direction:column;gap:3px;background:var(--soft);border-radius:9px;padding:4px 5px 5px;border-top:3px solid var(--pc);min-width:0}
.xstrip .xc.can{background:color-mix(in srgb,var(--pc) 22%,var(--soft));box-shadow:0 0 0 2px var(--pc),0 0 14px -3px var(--pc)}
.xstrip .xc.full{opacity:.45}
.xstrip .xl{display:flex;justify-content:space-between;align-items:baseline;gap:2px}
.xstrip .xl b{font-family:var(--display);font-weight:800;font-size:13px}.xstrip .xl i{font-style:normal;font-family:var(--led);font-size:12px;color:var(--mute)}
.xstrip .xc.can .xl i{color:var(--ink)}
.xstrip .xp{display:flex;flex-wrap:wrap;gap:1px;min-height:15px}
.xstrip .xp em{width:13px;height:13px;margin:1px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--pc) 70%,transparent)}
.xstrip .xv{align-self:center;font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;color:var(--blue);padding:0 3px}
.half .xstrip{padding:4px}.half .xstrip .xl b{font-size:12px}
.pitch.xi.big{padding:8px 6px;min-height:250px}.pitch.xi.big .slot .sn{font-size:11px}.pitch.xi.big .slot .sp{display:block;font-size:10px}
.gx{gap:6px}
.gxbar{flex:none;display:flex;gap:6px;align-items:center}.gxbar .mini{flex:none}.gxbar .lbl{flex:1;text-align:center}
.gxturn{flex:1;display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:5px 10px;background:var(--tc);color:#fff;font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;box-shadow:0 0 14px -4px var(--tc)}
.gxturn small{font-family:var(--led);font-size:15px}
.gxb{flex:none;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#14265A,#0B163A);border:1px solid #2B4386;border-radius:14px;padding:6px 10px}
.gxb.gold{border-color:var(--yellow);box-shadow:0 0 18px -6px var(--yellow)}
.gxb .tx{flex:1;min-width:0}.gxb .tags{display:flex;gap:4px;flex-wrap:wrap}.gxb .pos{font-size:11px;padding:0 6px}.gxb .tag{font-size:10px}
.gxb h3{margin:2px 0 0;font-size:21px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gxb small{font-size:11px;color:var(--mute)}
.gxb .board{margin:0;padding:3px 8px}.gxb .board .price{font-size:28px;min-width:46px}
.gxw{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:14px;text-transform:uppercase}
.gxw .turnline{font-size:13px;padding:1px 9px}.gxw .voir{font-family:var(--display);font-weight:700;font-size:13px;color:var(--blue);text-transform:uppercase}
.gxt{max-width:none;flex:none}
.gxs{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}.gxs .stamp{font-size:15px;padding:3px 10px;transform:none;border-width:2px}
.gx>.nb,.gx>.waitdraw{flex:none;margin:0 auto;max-width:none;width:100%;padding:9px}
.gxp{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-around;padding:6px 0;
 background:radial-gradient(ellipse 80% 50% at 50% 0,rgba(255,255,255,.14),transparent 60%),repeating-linear-gradient(180deg,var(--grass) 0 12.5%,var(--grass2) 12.5% 25%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 0 24px -8px rgba(24,209,126,.6)}
.gxp::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.4)}
.gxp::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
.gxp .box{position:absolute;left:28%;right:28%;bottom:-2px;height:30px;border:2px solid rgba(255,255,255,.4);border-bottom:0}
.gxp .row{position:relative;z-index:1;display:flex;justify-content:space-evenly}
.gp{display:flex;flex-direction:column;align-items:center;width:72px;min-width:0}
.gp .sn{font-family:var(--display);font-weight:700;font-size:12px;color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.1}
.gp .pr{font-size:10px;font-weight:700;color:rgba(255,255,255,.9)}
.gp .ph{width:30px;height:30px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:10px}
.gp.ghost .jer{filter:drop-shadow(0 0 10px #fff);animation:pulse 1.1s ease-in-out infinite}.gp.ghost .sn{color:var(--yellow)}
.gp.ghost .tag{font-size:9px;font-weight:800;font-family:var(--display);background:var(--yellow);color:#0A1430;border-radius:3px;padding:0 4px;text-transform:uppercase;line-height:1.4}
.gx .acts{flex:none}
.gxsheet{height:min(400px,58vh);display:flex}
.botd{margin:0;font-size:13px;font-weight:600;color:var(--ink);background:var(--soft);border-left:3px solid var(--blue);border-radius:6px;padding:6px 9px}
.secret{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:16px;background:rgba(5,10,24,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sbox{width:100%;max-width:340px;background:linear-gradient(180deg,#14265A,#0B163A);border:2px solid var(--tc);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 0 30px -8px var(--tc)}
.sbox>.lbl{color:var(--yellow);letter-spacing:.2em}.sbox h3{font-size:24px}.sbox p{margin:0;font-size:12px}
.srow{display:flex;align-items:center;gap:10px;text-align:left}.srow b{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1}.srow small{font-size:12px;color:var(--mute)}
.sbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%}.sbtns .mini{padding:8px 0;font-size:15px;color:var(--ink)}.sbtns .mini:disabled{opacity:.3}
.sbox .btn{width:100%}
.srev{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 8px;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase}
.srev .lbl{width:100%;text-align:center;color:var(--yellow);font-size:11px}.srev span:not(.lbl){color:var(--mute)}.srev span.w{color:#fff;background:var(--tc);border-radius:5px;padding:0 6px}
.isdraft .rteam .between small,.isdraft .acts,.isdraft .tile .mn,.isdraft .mine .num,.isdraft .gxturn small,.isdraft .tvtag.r,.isdraft .gp .pr,.isdraft .tvpl .pr,.isdraft .zone .mn{display:none!important}
.sbox.pick{max-width:360px}.picks{display:flex;flex-direction:column;gap:7px;width:100%}
.pickc{display:flex;align-items:center;gap:10px;text-align:left;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:12px;padding:7px 10px}
.pickc:active{transform:scale(.98)}.pickc>span{min-width:0;display:flex;flex-direction:column}.pickc b{font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickc small{font-size:12px;color:var(--mute)}.pickc em{font-style:normal;font-size:11px;font-weight:700;color:var(--green)}
.tvres.live,.winner.live{flex-direction:column;gap:1px;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0}
.winner.live{font-size:18px;line-height:1.2}
.rvl{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-size:13px}.rvl b{color:var(--yellow)}
.rvm{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;color:#fff}
.tvres.live{animation:pulse .5s ease-out}
.tag.scar{background:var(--red);color:#fff;animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 12px -2px var(--red)}.tag.scar.last{background:var(--yellow);color:#0A1430;box-shadow:0 0 14px -2px var(--yellow)}
#comm{position:fixed;left:0;right:0;top:50%;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:12px;transform:translateY(-50%)}
#comm:not(.duo){top:calc(env(safe-area-inset-top,0px) + 8px);transform:none}
#comm .cm{display:flex;align-items:stretch;max-width:min(88vw,400px);margin-left:max(10px,env(safe-area-inset-left,0px));border-radius:4px 10px 10px 4px;overflow:hidden;
 background:linear-gradient(90deg,rgba(5,10,24,.94),rgba(14,26,61,.9));box-shadow:0 8px 22px -8px rgba(0,0,0,.8);border-left:4px solid var(--blue);
 opacity:0;transform:translateX(-110%);transition:transform .38s cubic-bezier(.2,1.2,.4,1),opacity .25s}
#comm .cm .live{flex:none;display:flex;align-items:center;gap:5px;font-style:normal;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--blue);padding:0 8px 0 7px}
#comm .cm .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s steps(2,start) infinite}
#comm .cm b{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:#fff;line-height:1.15;padding:6px 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#comm.hot .cm{border-left-color:var(--yellow)}#comm.hot .cm .live{background:var(--yellow);color:#0A1430}#comm.hot .cm .live::before{background:#0A1430}#comm.hot .cm b{color:var(--boardtxt)}
#comm.on .cm{opacity:1;transform:none}
#comm .cm.flip{align-self:flex-end;margin:0 max(10px,env(safe-area-inset-right,0px)) 0 0;transform:rotate(180deg) translateX(-110%)}#comm.on .cm.flip{transform:rotate(180deg)}
@keyframes blink{to{visibility:hidden}}
.soldfx{position:absolute;inset:0;z-index:25;display:grid;place-items:center;border-radius:16px;pointer-events:auto;
 background:radial-gradient(circle,color-mix(in srgb,var(--tc) 70%,#0A1430),color-mix(in srgb,var(--tc) 35%,rgba(5,10,24,.85)) 75%);animation:sfx 2.8s ease-out forwards}
.soldfx.other{background:rgba(5,10,24,.72);pointer-events:none}.soldfx.other b{font-size:30px;color:var(--tc)}
.soldfx.full{position:fixed;z-index:68;border-radius:0}
.sfx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;animation:sfxpop .5s cubic-bezier(.2,1.6,.4,1) both}
.sfx .stag{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#0A1430;background:var(--yellow);border-radius:5px;padding:2px 10px;margin-bottom:6px;box-shadow:0 0 18px -2px var(--yellow)}
.sfx .jer{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));margin-bottom:4px}
.sfx .sk{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:#fff;line-height:1}
.sfx b{font-family:var(--display);font-weight:800;font-size:42px;text-transform:uppercase;color:#fff;line-height:.95;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sfx .sp{margin-top:4px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;color:#fff;background:rgba(5,10,24,.45);border-radius:6px;padding:2px 10px}
@keyframes sfx{0%{opacity:0}6%{opacity:1}86%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes sfxpop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}

let SKIP=null;

const LINE_L={G:"Les gardiens",DEF:"La défense",MIL:"Le milieu",ATT:"L'attaque",LIB:"La place libre"};
function playReveal(){
  const many=G.teams.length>2,tv=G.teams.length===2,L=linesOf(),tot=G.teams.map(()=>0);let step=0,shown=0,fast=false,prevLd=-1;
  const later=(f,ms)=>{if(fast)f();else timers.push(setTimeout(f,ms))};
  SKIP=()=>{if(fast)return;fast=true;timers.forEach(clearTimeout);timers=[];next()};
  const nm=t=>G.mode==="solo"&&t===G.teams[0]?"Toi":t.name.replace(/^(Le |Mme )/,"");
  const w=$("#winner");
  const next=()=>{
    if(step<L.length){const line=L[step++],part=G.teams.map(t=>line.reduce((a,k)=>a+(t.sl[k]?force(t.sl[k]):0),0));shown+=line.length;
      G.teams.forEach((t,ti)=>{tot[ti]+=part[ti];if(!tv)$("#pt"+ti).innerHTML=pitchHTML(t,{reveal:shown,small:many});$("#tot"+ti).textContent=tot[ti]});
      if(tv)$("#tvin").innerHTML=tvPitchInner(shown);
      if(!fast&&w){const best=Math.max(...tot),lead=G.teams.filter((_,i)=>tot[i]===best),ld=lead.length>1?-1:G.teams.indexOf(lead[0]);
        if(step>1&&ld>=0&&prevLd>=0&&ld!==prevLd){roar(false);voice("remontada")}
        else if(step===L.length-1&&G.winner>=0&&Math.abs(G.teams[0].score.total-(G.teams[1]||{score:{total:0}}).score.total)<=5&&G.teams.length===2)voice("serre");
        prevLd=ld;const pb=Math.max(...part),pw=G.teams.filter((_,i)=>part[i]===pb);
        w.innerHTML=`<span class="rvl"><b>${LINE_L[slotPos(line[0])]}</b> · ${tv?`${part[0]} – ${part[1]}`:`${esc(pw.length>1?"égalité":nm(pw[0]))} ${pw.length>1?"":"la gagne"}`}</span><span class="rvm">${lead.length>1?"Égalité au total":G.mode==="solo"&&lead[0]===G.teams[0]?"Tu mènes":esc(nm(lead[0]))+" mène"} · ${best} pts</span>`;
        w.classList.add("on","live")}
      later(next,1500);return}
    G.teams.forEach((t,ti)=>{$("#tot"+ti).textContent=t.score.total});
    w.classList.remove("live");
    if(tv){const lo=$("#tot"+(G.winner===0?1:0));if(G.winner>=0&&lo)lo.classList.add("lo")}
    if(G.winner<0)w.textContent="Égalité parfaite !";
    else{const t=G.teams[G.winner],gap=t.score.total-G.teams.filter(x=>x!==t).reduce((m,x)=>Math.max(m,x.score.total),0);
      const txt=G.mode==="solo"&&G.winner===0?"Tu gagnes !":t.name+" gagne !";
      if(tv){w.innerHTML=`<i style="background:${t.col}"></i>${esc(G.mode==="solo"&&G.winner===0?"Tu gagnes":t.name+" gagne")} · ${G.tieMoney?"plus d'argent gardé":"+"+gap+" point"+(gap>1?"s":"")+" d'écart"}`}
      else{w.textContent=txt+(G.tieMoney?" (plus d'argent)":"");$("#rt"+G.winner).classList.add("win")}
    }
    w.classList.add("on");$("#after").classList.add("on");const sk=$("#skip");if(sk)sk.hidden=true;
    winBlast();
  };
  /* Coup de sifflet final dès l'arrivée sur l'écran, puis « Et c'est terminé ! » ; l'ovation vient avec l'annonce du gagnant */
  whistle();timers.push(setTimeout(()=>voice("fin"),1700));
  timers.push(setTimeout(next,700));
}

  <input id="pname" maxlength="28" placeholder="Nom du pack, ex. Les légendes du quartier" value="${esc(c.name||"")}" aria-label="Nom du pack">
  <p class="mute" style="font-size:13px">Un joueur par ligne : <b>Nom ; Poste ; Note</b>, ou <b>Nom ; Poste ; Club ; Note</b>. Poste : G, DEF, MIL ou ATT. Note de 1 à 99. Il faut au moins 15 joueurs, dont 3 gardiens, 3 défenseurs, 3 milieux et 3 attaquants.</p>
  <textarea id="ptxt" placeholder="Karim ; ATT ; FC Quartier ; 88&#10;Yanis ; G ; 75&#10;Sofiane ; MIL ; 82" aria-label="Joueurs du pack">${esc(c.txt||"")}</textarea>
  <p class="err" id="perr"></p>
  <button class="btn go" data-act="saveperso">Enregistrer le pack</button></div>`}
function saveperso(){const name=$("#pname").value.trim(),txt=$("#ptxt").value,{lines,bad}=parsePerso(txt),err=$("#perr");
  if(!name){err.textContent="Donne un nom à ton pack.";return}
  if(bad.length){err.textContent=`Ligne${bad.length>1?"s":""} ${bad.slice(0,6).join(", ")} : écris Nom ; Poste ; Note (poste G, DEF, MIL ou ATT).`;return}
  const cnt={G:0,DEF:0,MIL:0,ATT:0};lines.forEach(l=>cnt[l.split("/")[1]]++);
  if(lines.length<15||lines.length>80){err.textContent=`Il faut entre 15 et 80 joueurs (tu en as ${lines.length}).`;return}
  const miss=Object.entries(cnt).filter(([k,v])=>v<3).map(([k])=>POS[k].l.toLowerCase()+"s");
  if(miss.length){err.textContent="Il manque des "+miss.join(", ")+" (3 minimum par poste).";return}
  const id=EDIT.id||"perso_"+Date.now().toString(36),c={id,name,raw:lines.join("\n"),txt};
  const i=P.custom.findIndex(x=>x.id===id);if(i>=0)P.custom[i]=c;else P.custom.push(c);regCustom(c);saveP();toast("Pack enregistré");go("perso")}
/* ===================== Actions ===================== */
document.addEventListener("click",e=>{
  const w=e.target.closest(".wrap");if(w&&e.target===w&&w.dataset.close){if(PAUSED)resume();else closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="go")go(v);
  else if(a==="setup"){SETUP={mode:v,kind:P.kind==="draft"?"draft":"auction",format:FORMATS[P.format]?P.format:"five",formation:P.formation||"4-3-3",pack:PACKS[P.pack]&&packOpen(P.pack)?P.pack:DEFPK,nai:P.nai,tempo:P.tempo,diff:P.diff||"normal",chaos:P.chaos!==false,names:P.names.slice()};OPTOPEN=false;go("setup")}
  else if(a==="packs"){PK_TAB=null;PK_Q="";packsSheet()}
  else if(a==="pktab"){PK_TAB=v;PK_Q="";packsSheet()}
  else if(a==="pickpack"){if(!packOpen(v)){buySheet("pk_"+v);return}SETUP.pack=v;closeSheet();render()}
  else if(a==="seg"){SETUP[b.dataset.k]=b.dataset.k==="nai"?+v:v;const inSheet=!!b.closest(".sheet");render();if(inSheet)optsSheet()}
  else if(a==="fmt"){SETUP.format=v;if(v==="xi"&&!SETUP.formation)SETUP.formation="4-3-3";render()}
  else if(a==="formation"){SETUP.formation=v;render()}
  else if(a==="addname"){if(SETUP.names.length<4)SETUP.names.push("Joueur "+(SETUP.names.length+1));render()}
  else if(a==="delname"){SETUP.names.splice(+v,1);render()}
  else if(a==="start"){$$("[data-name]").forEach(i=>SETUP.names[+i.dataset.name]=i.value);
    const fmax=FORMATS[SETUP.format].max,miss=fmtMissing(SETUP.pack,fmtSlots(SETUP),fmax===2?2:(SETUP.mode==="solo"?SETUP.nai+1:SETUP.names.length));
    if(miss){toast(`Ce pack n'a pas assez de ${miss} pour ce format`);return}
    Object.assign(P,{pack:SETUP.pack,nai:SETUP.nai,tempo:SETUP.tempo,diff:SETUP.diff,chaos:SETUP.chaos,format:SETUP.format,formation:SETUP.formation,kind:SETUP.kind});if(SETUP.mode==="amis")P.names=SETUP.names.slice();saveP();SERIES=null;startGame(SETUP)}
  else if(a==="draw"){if(G.phase==="sold"||G.phase==="skip"||G.phase==="draw"){if(isOver())finish();else draw()}}
  else if(a==="sb"){G.cur.sv=Math.max(10,Math.min(maxBid(G.teams[G.cur.sq[0]]),G.cur.sv+ +v));render()}
  else if(a==="sok")secretSubmit();
  else if(a==="pick"&&G&&G.phase==="pick")finishPick(+v);
  else if(a==="sme"){G.cur.sready=true;render()}
  else if(a==="bid"){const ti=b.dataset.i!=null?+b.dataset.i:G.mode==="solo"?0:G.cur.turn;raise(ti,+v)}
  else if(a==="pass"){const ti=b.dataset.i!=null?+b.dataset.i:G.mode==="solo"?0:G.cur.turn;pass(ti)}
  else if(a==="voir")voirSheet(+v);
  else if(a==="rules")rulesSheet();
  else if(a==="pals")palSheet();
  else if(a==="pal"){P.pal=v;saveP();applyPal();palSheet()}
  else if(a==="legal")legalSheet();
  else if(a==="pause")pauseSheet();
  else if(a==="resumePause")resume();
  else if(a==="resume"){G=loadGame();if(!G){render();return}rnd=mulberry((G.seed||7)+G.pos*7919);SAY={};SERIES=null;PAUSED=false;
    if(G.phase==="auction"){G.cur.turnEnd=G.ms?Date.now()+G.ms:0;G.cur.aiAt=G.teams[G.cur.turn].ai?Date.now()+1200:0}go("game")}
  else if(a==="newpack"){SETUP=Object.assign({},G.setup,{seed:undefined,daily:undefined});go("setup");PK_TAB=null;PK_Q="";packsSheet()}
  else if(a==="skip"){SKIP&&SKIP()}
  else if(a==="chaos"){SETUP.chaos=!SETUP.chaos;render();optsSheet()}
  else if(a==="opts")optsSheet();
  else if(a==="close"){if(PAUSED&&SCREEN==="game")pauseSheet();else closeSheet()}
  else if(a==="quit"){PAUSED=false;stopLoop();saveGame();G=null;go("home")}
  else if(a==="revanche"){startGame(G.setup)}
  else if(a==="share")share();
  else if(a==="daily")startDaily();
  else if(a==="buy")buySheet(v);
  else if(a==="pay")PAY.buy(v);
  else if(a==="shoptab"){SHOP_TAB=v;render()}
  else if(a==="restore")restoreSheet();
  else if(a==="dorestore")PAY.restore($("#remail").value.trim());
  else if(a==="relast"){const L=P.last;SETUP={mode:"solo",format:FORMATS[P.format]?P.format:"five",formation:P.formation||"4-3-3",pack:packOpen(L.pack)?L.pack:DEFPK,nai:P.nai,tempo:P.tempo,diff:P.diff||"normal",chaos:P.chaos!==false,names:P.names.slice()};if(!L.solo)SETUP.mode="amis";go("setup")}
  else if(a==="weekpack"){const wf=weekFree();SETUP={mode:"solo",format:FORMATS[P.format]?P.format:"five",formation:P.formation||"4-3-3",pack:wf,nai:P.nai,tempo:P.tempo,diff:P.diff||"normal",chaos:P.chaos!==false,names:P.names.slice()};go("setup")}
  else if(a==="sound"){const on=!sfxOk();P.sound=on;P.crowd=on;saveP();if(!on)hushSfx();else beep(1250,.07,"triangle",.11);togIn(b,on)}
  else if(a==="voice"){P.voice=P.voice===false;saveP();if(P.voice===false)hushVoice();togIn(b,P.voice!==false)}
  else if(a==="albpack")albumSheet(v);
  else if(a==="newperso"){EDIT={};go("edit")}
  else if(a==="editperso"){const c=P.custom.find(x=>x.id===v);EDIT={id:c.id,name:c.name,txt:c.txt||c.raw.split("\n").map(l=>{const x=l.split("/");return`${x[0]} ; ${x[1]} ; ${x[2]} ; ${x[4]}`}).join("\n")};go("edit")}
  else if(a==="delperso"){if(DEL!==v){DEL=v;render();return}P.custom=P.custom.filter(x=>x.id!==v);delete PACKS[v];DEL=null;if(P.pack===v)P.pack=DEFPK;saveP();render()}
  else if(a==="saveperso")saveperso();
});
document.addEventListener("input",e=>{const i=e.target.closest("[data-name]");if(i&&SETUP)SETUP.names[+i.dataset.name]=i.value});
/* Simulation pour régler les ordis (console : simulate(500)) */
window.simulate=function(n=300,pack=DEFPK,nai=3){
  SIM=true;const st={games:0,left:0,empty:0,wins:{},spentMin:1e9};
  for(let g=0;g<n;g++){startGame({mode:"solo",allai:true,nai,pack,format:"five",tempo:"aucun"});
    let guard=0;while(G.phase!=="end"&&guard++<5000){if(G.phase==="auction")aiTurn(G.cur.turn);else draw()}
    st.games++;G.teams.forEach(t=>{st.left+=t.money;st.empty+=emptySlots(t)});if(G.winner>=0){const p=G.teams[G.winner].pers;st.wins[p]=(st.wins[p]||0)+1}}
  SIM=false;rnd=Math.random;G=null;
  return{games:st.games,avgLeft:+(st.left/(n*nai)).toFixed(1),emptyPerTeam:+(st.empty/(n*nai)).toFixed(3),wins:st.wins};
};
applyPal();render();PAY.back();

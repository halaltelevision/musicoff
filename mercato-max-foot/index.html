<title>Mercato Max Foot</title>
<meta name="description" content="Mercato Max Foot : Mise. Bluffe. Recrute. Construis l'équipe de tes rêves aux enchères, seul ou entre amis.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout : un seul écran façon soir de match — bandeau des adversaires, carte joueur sous les projecteurs, tableau LED de la mise, ton terrain en bas */
:root{
  --bg:#0A1430;--card:#111F48;--soft:#1B2C5E;--line:#253A75;--ink:#EEF3FF;--mute:#93A3D1;
  --red:#FF4563;--blue:#3D8BFF;--yellow:#FFC93C;--green:#18D17E;--violet:#8B6BFF;
  --accent:var(--red);--accent-soft:#3A1F3D;--grass:#0F7A45;--grass2:#108350;--board:#050A18;--boardtxt:#FFD84A;
  --bgimg:radial-gradient(ellipse 60% 40% at 10% -5%,rgba(160,200,255,.32),transparent 70%),radial-gradient(ellipse 60% 40% at 90% -5%,rgba(160,200,255,.32),transparent 70%);
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --led:"Chakra Petch","Saira Condensed",monospace;
  --press:0 6px 16px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 15px/1.4 var(--body);background-image:var(--bgimg);background-attachment:fixed;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;-webkit-tap-highlight-color:transparent}
body.ingame{padding-block:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-size:28px}
p{margin:0}
.mute{color:var(--mute)}
.app{max-width:460px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:12px}
.lbl{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.bill{display:inline-block;width:.95em;height:.56em;margin-left:.22em;vertical-align:.06em;border-radius:.1em;background:radial-gradient(circle at 50% 50%,#2F8A4A 0 .13em,transparent .14em),linear-gradient(#7FCF8A,#4FAE62);box-shadow:inset 0 0 0 .07em #2F8A4A}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.btn{border-radius:12px;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s}
.btn.go{background:var(--accent);border-color:transparent;color:#fff;font-size:22px;padding:13px;box-shadow:var(--press)}
.btn.blue{background:var(--blue);border-color:transparent;color:#fff;box-shadow:var(--press)}
.btn:active,.bid:active,.opt:active,.mode:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{border-radius:9px;padding:5px 11px;font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--card);border:1px solid var(--line);color:var(--mute)}

/* Accueil */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.logo svg{width:84px;height:95px}
.mark{font-family:var(--display);font-size:50px;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.mark span{color:var(--accent)}
.mark em{font-style:normal;display:inline-block;background:var(--green);color:#fff;font-size:22px;line-height:1;padding:4px 9px 3px;border-radius:6px;vertical-align:middle;transform:translateY(-6px) rotate(-3deg);letter-spacing:.06em}
.tagline{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:14px;min-height:138px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;position:relative;overflow:hidden;box-shadow:var(--press)}
.mode::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.18) 49.5% 50.5%,transparent 50.5%),radial-gradient(circle at 50% 50%,transparent 26px,rgba(255,255,255,.18) 27px 28px,transparent 29px);pointer-events:none}
.mode b{font-family:var(--display);font-size:30px;line-height:.95;text-transform:uppercase;position:relative}
.mode small{font-size:13px;font-weight:600;opacity:.95;line-height:1.25;position:relative}
.mode .ico{position:relative;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px;align-self:flex-start}
.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.proto{text-align:center;font-size:12px}

/* Préparation */
.topbar{display:flex;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.seg{display:flex;gap:3px;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border-radius:9px;padding:7px 4px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--mute);line-height:1.1}
.seg button small{display:block;font-family:var(--body);text-transform:none;font-size:11px;font-weight:600;opacity:.85}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,51,.18)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border-radius:12px;padding:9px 6px 8px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;position:relative;min-width:0}
.opt b{font-family:var(--display);font-size:18px;line-height:1.05;text-transform:uppercase}
.opt small{font-size:11px;color:var(--mute);line-height:1.2}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.5}
.opt .soon{position:absolute;top:-8px;right:-3px;background:var(--yellow);color:#141433;font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;border-radius:5px;padding:0 6px}
.fm{display:flex;gap:2px;margin-bottom:3px}
.fm i{width:7px;height:7px;border-radius:2px;background:var(--pc)}
input{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:5px;align-items:center}.nrow .dot{width:22px;height:22px;font-size:13px}.nrow input{padding:8px}.nrow .x{width:26px;height:34px}.nrow>span:empty{display:none}
.dot{width:26px;height:26px;border-radius:7px;background:var(--tc);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.x{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--mute);font-size:18px}

/* Terrain */
.jer{display:block}
.pitch{position:relative;border-radius:12px;padding:6px 6px 5px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;overflow:hidden;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.55) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,var(--grass) 0 10%,var(--grass2) 10% 20%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border:2px solid rgba(255,255,255,.5);border-radius:50%}
.pitch::after{content:"";position:absolute;left:0;top:26%;bottom:26%;width:20px;border:2px solid rgba(255,255,255,.5);border-left:0}
.slot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.slot .ph{width:36px;height:36px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:13px;font-weight:700;margin:2px 0}
.slot.can .ph{border-style:solid;border-color:#fff;background:rgba(255,255,255,.25);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.slot .sn{font-family:var(--display);font-size:13px;font-weight:700;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.slot .sp{font-size:10px;font-weight:600;color:rgba(255,255,255,.9);line-height:1.1}
.slot .sv{font-family:var(--display);font-size:15px;font-weight:800;color:#141433;background:#fff;border-radius:5px;padding:0 6px;line-height:1.3;margin-top:1px;font-variant-numeric:tabular-nums}
.slot .sv.gold{background:var(--yellow)}
.slot .hide{visibility:hidden}

/* Jeu */
.gscreen{height:calc(100dvh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;min-height:540px}
.tiles{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;border-top:3px solid var(--tc)}
.tile.turn{box-shadow:0 0 0 2px var(--tc)}
.tile .top{display:flex;align-items:center;gap:6px;min-width:0}
.tile .dot{width:20px;height:20px;font-size:12px;border-radius:5px}
.tile .nm{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1}
.tile .mn{font-family:var(--display);font-size:16px;font-weight:700;margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.tile .low{display:flex;align-items:center;gap:4px}
.pips{display:flex;gap:3px}
.pips i{width:13px;height:13px;border-radius:3px;background:var(--soft);font-style:normal}
.pips i.f{background:var(--pc)}
.tile .voir{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}
.tile .st{position:absolute;top:-10px;right:8px;font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--tc);border-radius:4px;padding:0 6px;white-space:nowrap}
.bubble{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--board);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:5;pointer-events:none}
.bubble::after{content:"";position:absolute;top:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--board)}

.cardz{flex:1;min-height:0;display:flex}
.fcard{flex:1;position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:46px 14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.fcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--pc,var(--soft))}
.fcard.gold{background:linear-gradient(170deg,#FFF6D6,#FFE38A);border-color:#F2C744;color:#141433}
.fcard.gold .club,.fcard.gold .note,.fcard.gold .lbl{color:#6B5A1E}
.fcard.gold .cname{color:#141433}
.cbar{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.cbar .lbl{font-size:12px}
.posb{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.pos{background:var(--pc);color:#fff;border-radius:5px;padding:1px 10px;font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag{border-radius:5px;padding:1px 9px;font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag.gold{background:#141433;color:var(--yellow)}
.tag.mys{background:var(--violet);color:#fff}
.jwrap{position:relative;display:grid;place-items:center}
.jwrap::before{content:"";position:absolute;width:118%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pc) 22%,transparent),transparent 68%)}
.jwrap .jer{position:relative}
.cname{font-family:var(--display);font-size:clamp(28px,5.4vh,40px);font-weight:800;line-height:.95;text-transform:uppercase;color:var(--ink);text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.club{font-size:14px;color:var(--mute);font-weight:600}
.board{display:flex;align-items:center;gap:10px;background:var(--board);color:#fff;border-radius:10px;padding:4px 6px 4px 12px;margin-top:4px}
.board .lbl{color:rgba(255,255,255,.65);font-size:12px}
.price{font-family:var(--display);font-size:clamp(30px,5.6vh,42px);font-weight:800;line-height:1;color:var(--boardtxt);font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.who{font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;min-height:18px}
.turnline{font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--tc);border-radius:6px;padding:2px 12px}
.timer{width:100%;max-width:220px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--blue)}
.timer i.warn{background:var(--yellow)}.timer i.hurry{background:var(--red)}
.call{font-family:var(--display);font-size:15px;font-weight:700;color:var(--red);min-height:16px;text-transform:uppercase}
.stamp{background:var(--tc);color:#fff;border-radius:8px;padding:5px 14px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;transform:rotate(-3deg);border:3px solid #fff;box-shadow:0 0 0 2px var(--tc)}
.note{font-size:14px;font-weight:600;color:var(--mute);max-width:280px}
.nb{width:100%;max-width:300px;margin-top:4px}

.mine{display:flex;flex-direction:column;gap:6px}
.mine .between b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.mine .between .num{font-size:24px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bid{border-radius:12px;background:var(--tc);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;padding:8px 2px 7px;box-shadow:var(--press);line-height:1}
.bid.pass{background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:16px;text-transform:uppercase}
.bid:disabled{opacity:.3;box-shadow:none}

/* Résultats */
.res{gap:7px}
.rteam{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:5px}
.rteam.win{border-color:var(--yellow);border-left-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.rteam .between b{font-family:var(--display);font-size:19px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.rteam .between>.row:first-child{flex:1;min-width:0}.rteam .between>.row:last-child{flex:none}
.rteam small{font-size:12px}
.tot{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bonus{font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--green);border-radius:5px;padding:0 6px;white-space:nowrap}
.bonus:empty{display:none}
.rteam .pitch{padding:3px}
.rteam .slot .ph{width:28px;height:28px}
.pitch.sm{padding:2px 4px}.pitch.sm .slot .ph{width:22px;height:22px;font-size:10px;margin:1px 0}.pitch.sm .slot .sn{font-size:11px}.pitch.sm .slot .sv{font-size:13px;line-height:1.15}
.res.many{gap:5px}.res.many .rteam{padding:4px 8px 5px;gap:3px}.res.many .tot{font-size:24px}.res.many .rteam .between b{font-size:17px}.res.many .winner{font-size:28px;min-height:28px}
.res.many h2{font-size:22px}.res.many .pitch.sm .slot .sn{font-size:10px;line-height:1}.res.many .award{padding:3px 7px}.res.many .acts3 .btn{padding:8px 4px}.res.many .after{gap:5px}
.tiles.n4 .dot{display:none}.tiles.n4 .tile{padding:5px 6px}.tiles.n4 .tile .mn{font-size:14px}.tiles.n4 .pips i{width:10px;height:10px}
.winner{text-align:center;font-family:var(--display);font-size:34px;font-weight:800;line-height:1;text-transform:uppercase;color:var(--accent);opacity:0;transform:scale(.85);transition:.35s cubic-bezier(.2,1.4,.4,1);min-height:34px}
.winner.on{opacity:1;transform:none}
.after{display:flex;flex-direction:column;gap:7px;opacity:0;pointer-events:none;transition:opacity .4s}
.after.on{opacity:1;pointer-events:auto}
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.award{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;min-width:0}
.award .lbl{font-size:11px}
.award b{display:block;font-family:var(--display);font-size:15px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.acts3 .btn{padding:10px 4px;font-size:17px}
.series{text-align:center;font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;color:var(--mute)}

/* Feuilles, toasts, prime */
.wrap{position:fixed;inset:0;background:rgba(14,16,36,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:20px;padding:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rules{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.rules li span{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:800;font-size:16px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palbtn{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;border:1px solid var(--line)}
.palbtn[aria-pressed=true]{outline:3px solid var(--blue);outline-offset:2px}
.palbtn .sw{display:flex;gap:4px}
.palbtn .sw i{width:18px;height:18px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--board);color:#fff;font-weight:600;border-radius:12px;padding:10px 16px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.prime{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(14,16,36,.45)}
.pbox{background:var(--card);border-radius:20px;padding:20px 26px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;border-top:6px solid var(--green);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.pbox b{font-family:var(--display);font-size:64px;line-height:1;color:var(--green)}
.pbox .lbl{color:var(--green)}
.pbox .pw{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
@keyframes pop{from{transform:scale(.4);opacity:0}}
[data-onbg="1"] .logo,[data-onbg="1"] .screen>.lbl,[data-onbg="1"] .field>.lbl,[data-onbg="1"] .topbar h2,[data-onbg="1"] .res>.between,[data-onbg="1"] .proto,[data-onbg="1"] .field>small,[data-onbg="1"] .series,[data-onbg="1"] .mine>.between{color:#fff}
[data-onbg="1"] .lbl{color:inherit}

/* ===== Look « Stade de nuit » (ambiances sombres) ===== */
[data-look="nuit"] .fcard{background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(200,225,255,.22),transparent 70%),linear-gradient(180deg,#14265A,#0B163A);border-color:#2B4386;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px -10px rgba(0,0,0,.6)}
[data-look="nuit"] .fcard.gold{background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(255,240,180,.5),transparent 70%),linear-gradient(180deg,#FFE892,#F2C744);border-color:#FFD84A;box-shadow:0 0 28px -6px rgba(255,201,60,.7)}
[data-look="nuit"] .fcard::before{box-shadow:0 0 16px var(--pc)}
[data-look="nuit"] .price,[data-look="nuit"] .tile .mn,[data-look="nuit"] .mine .num,[data-look="nuit"] .tot,[data-look="nuit"] .pbox b{font-family:var(--led)}
[data-look="nuit"] .price{text-shadow:0 0 12px rgba(255,216,74,.7);font-size:clamp(34px,6.4vh,46px)}
[data-look="nuit"] .board{padding:6px 10px 6px 14px;border-radius:6px;border:2px solid var(--boardtxt);background:repeating-linear-gradient(90deg,#050A18 0 3px,#07102A 3px 4px);box-shadow:0 0 18px -4px rgba(255,216,74,.6)}
[data-look="nuit"] .pitch{background:radial-gradient(ellipse 80% 120% at 50% -20%,rgba(255,255,255,.18),transparent 60%),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.5) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,var(--grass) 0 10%,var(--grass2) 10% 20%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 24px -6px rgba(24,209,126,.55)}
[data-look="nuit"] .bid{background:transparent;border:2px solid var(--tc);color:var(--tc);text-shadow:0 0 10px var(--tc);box-shadow:0 0 14px -3px var(--tc),inset 0 0 12px -4px var(--tc)}
[data-look="nuit"] .bid.pass{background:var(--card);border-color:var(--line);color:var(--ink);text-shadow:none;box-shadow:none}
[data-look="nuit"] .bid:disabled{box-shadow:none;text-shadow:none}
[data-look="nuit"] .turnline,[data-look="nuit"] .stamp{box-shadow:0 0 14px -2px var(--tc)}
[data-look="nuit"] .tile{box-shadow:0 -6px 16px -8px var(--tc)}
[data-look="nuit"] .tile.turn{box-shadow:0 0 0 2px var(--tc),0 0 18px -4px var(--tc)}
[data-look="nuit"] .mode{background:transparent!important;border:2px solid currentColor;box-shadow:0 0 30px -8px currentColor}
[data-look="nuit"] .mode:first-child{color:var(--red)}[data-look="nuit"] .mode:last-child{color:var(--blue)}
[data-look="nuit"] .mode b,[data-look="nuit"] .mode small{color:var(--ink)}
[data-look="nuit"] .btn.go{box-shadow:0 0 22px -6px var(--accent)}
[data-look="nuit"] .btn.blue{box-shadow:0 0 22px -6px var(--blue)}
[data-look="nuit"] .mark{text-shadow:0 0 22px rgba(255,69,99,.35)}
[data-look="nuit"] .jwrap::before{background:radial-gradient(circle,color-mix(in srgb,var(--pc) 40%,transparent),transparent 68%)}
[data-look="nuit"] .tot{background:var(--board);color:var(--boardtxt);border:1.5px solid var(--boardtxt);border-radius:6px;padding:1px 8px 0;text-shadow:0 0 10px rgba(255,216,74,.7);box-shadow:0 0 14px -4px rgba(255,216,74,.6)}
[data-look="nuit"] .rteam.win{background:color-mix(in srgb,var(--yellow) 12%,var(--card));box-shadow:0 0 0 2px var(--yellow),0 0 24px -6px var(--yellow)}
[data-look="nuit"] .winner{text-shadow:0 0 22px rgba(255,69,99,.55)}
[data-look="nuit"] .pbox{box-shadow:0 0 40px -8px var(--green)}
[data-look="nuit"] .seg button[aria-pressed=true]{box-shadow:0 0 0 1px var(--line)}
[data-look="clair"] .tot{color:var(--accent)}
 /* Catalogue des packs */
.pkbtn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:6px 10px}
.pkt{flex:1;min-width:0;display:flex;flex-direction:column}
.pkt b{font-family:var(--display);font-size:20px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pkch{flex:none;font-family:var(--display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}

#pksearch{flex:none}
.pklist{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;flex:1;padding-bottom:4px}

.pkitem .jer{flex:none}

/* ===== Accueil, boutique, profil, album, packs perso ===== */
.home{gap:10px}
.home .logo{padding-top:0}.home .logo svg{width:62px;height:70px}.home .mark{font-size:44px}
.lvlpill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 9px 3px 3px;min-width:0}
.lvlpill b{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px}
.lvlpill>span:not(.bar){font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.lvlpill .bar{width:38px;flex:none}
.bar{display:block;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.dailyc{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:12px;padding:8px 10px}
.dt{flex:1;min-width:0;display:flex;flex-direction:column}
.dt .lbl{color:var(--yellow);font-size:12px}
.dt b{font-family:var(--display);font-size:19px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt small{font-size:12px;color:var(--mute)}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.nav b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.nav small{font-size:11px;color:var(--mute);white-space:nowrap}
.page{height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;display:flex;flex-direction:column;gap:10px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.freebox{background:color-mix(in srgb,var(--green) 14%,var(--card));border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;font-size:13px}
.freebox b{font-family:var(--display);font-size:16px;text-transform:uppercase;color:var(--green)}
.prod{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex:none}
.prod .l{flex:1;min-width:0;display:flex;flex-direction:column}
.prod .l b{font-family:var(--display);font-size:17px;line-height:1.1;text-transform:uppercase}
.prod .l span{font-size:12px;color:var(--mute);line-height:1.25}
.prod.feat{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.prod.own .p{color:var(--green);font-family:var(--display);font-weight:700;text-transform:uppercase}
.pico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px}
.buy{flex:none;background:var(--accent);color:#fff;border-radius:9px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:16px}
.dev{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.dev .num{font-family:var(--led,var(--display));font-size:18px;letter-spacing:.04em;user-select:all;flex:1}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:1em;margin:0}
.badge{display:inline-block;align-self:flex-start;margin-top:2px;border-radius:4px;padding:0 5px;font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge.lock{background:var(--yellow);color:#141433}.badge.gift{background:var(--green);color:#fff}
.pkitem>span{align-items:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stats .num{font-size:24px;font-family:var(--led,var(--display))}
.stats small{font-size:11px;color:var(--mute);line-height:1.2}
.lvt{font-family:var(--display);font-size:18px;text-transform:uppercase}
.mis{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.mis .mt{flex:1;min-width:0}.mis .mt b{font-size:13px;font-weight:600}
.mis .mr{flex:none;text-align:right;font-family:var(--display);font-weight:700;display:flex;flex-direction:column;font-size:15px}
.mis .mr small{font-family:var(--body);font-size:10px;color:var(--mute);font-weight:600}
.mis.ok .mr{color:var(--green)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;opacity:.6}
.ach>div.on{opacity:1}
.ach .tier{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;align-self:flex-start;border-radius:4px;padding:0 6px;color:#141433}
.ach .t1 .tier,.ach>.t1 .tier{background:#E0A06A}.ach>.t2 .tier{background:#C9D1E0}.ach>.t3 .tier{background:var(--yellow)}
.ach>div.on.t3{box-shadow:0 0 0 1.5px var(--yellow)}
.ach b{font-size:13px;line-height:1.2}.ach small{font-size:11px;color:var(--mute);line-height:1.25}.ach .gp{font-weight:700}
.tog{flex:none;width:48px;height:28px;border-radius:99px;background:var(--soft);position:relative}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed=true]{background:var(--green)}.tog[aria-pressed=true]::after{left:23px}
.albrow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;flex:none}
.albrow .at{flex:1;min-width:0}.albrow .at b{font-family:var(--display);font-size:16px;text-transform:uppercase}
.albrow .ap{flex:none;font-family:var(--display);font-weight:700;font-size:16px}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acard{background:var(--soft);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.55;border-top:3px solid var(--pc)}
.acard.on{opacity:1}.acard b{font-size:11px;line-height:1.15;overflow-wrap:anywhere}.acard small{font-size:10px;color:var(--mute)}
textarea{font:inherit;width:100%;flex:1;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);resize:none}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}

/* ===== Réglages repris de l'appli générale ===== */
.resume{display:flex;flex-direction:column;align-items:flex-start;background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px;text-align:left}
.resume b{font-family:var(--display);font-size:18px;text-transform:uppercase}.resume small{font-size:12px;opacity:.9}
.optsd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.optsd{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}
.optsd summary::-webkit-details-marker{display:none}
.optsd summary b{font-family:var(--display);font-size:17px;text-transform:uppercase}.optsd summary b::after{content:" ▾";color:var(--mute)}
.optsd[open] summary b::after{content:" ▴"}
.optsd summary small{font-size:12px;color:var(--mute);text-align:right}
.optin{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bid small{display:block;font-family:var(--body);font-size:10px;font-weight:600;opacity:.85;margin-top:1px;text-shadow:none}
.coach{font-size:12px;font-weight:600;background:var(--board);color:#fff;border-radius:10px;padding:5px 10px;max-width:300px}
.waitdraw{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;color:var(--mute);background:var(--soft);border-radius:10px;padding:8px 14px;width:100%;max-width:300px;text-align:center}
.duo{gap:6px}

.duo .fcard.duoc{margin:3px;padding:26px 8px 6px;gap:2px;border-radius:16px;justify-content:space-between}
.duo .dmain .jer{width:36px;height:36px}.duo .posb .pos,.duo .posb .tag{font-size:12px;padding:0 7px}
.duo .fcard.duoc>.stamp{transform:none;border-width:2px}
.duo .fcard.duoc .cbar{top:6px}
.duo .dtitle{font-size:24px}
.dmain{display:flex;align-items:center;gap:10px;max-width:100%}
.dnm{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.duo .cname{font-size:clamp(18px,3.2vh,24px)}.duo .club{font-size:12px}
.drow2{display:flex;align-items:center;gap:10px}
.duo .board{margin:0;padding:2px 8px}.duo .price{font-size:26px;min-width:44px}
.duo .who{font-size:13px}
.duo .turnline{font-size:14px;padding:1px 10px}.duo .turnline.off{background:var(--soft)!important;color:var(--mute);box-shadow:none}
.duo .timer{height:5px}
.duo .stamp{font-size:13px;padding:2px 8px}
.duo .nb{padding:6px;font-size:16px;margin:0;max-width:none}.duo .waitdraw{padding:5px 10px;font-size:13px;max-width:none}
.duo .mine{gap:4px}.duo .mine .between b{font-size:15px}.duo .mine .between .num{font-size:18px}
.duo .bid{padding:5px 2px;font-size:19px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zones.n3 .zone:last-child{grid-column:1/-1}
.zone{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:12px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.zone.turn{box-shadow:0 0 0 2px var(--tc),0 0 16px -4px var(--tc)}
.zone .top{display:flex;align-items:center;gap:6px;min-width:0}.zone .dot{width:20px;height:20px;font-size:12px;border-radius:5px}
.zone .nm{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.zone .mn{font-family:var(--display);font-size:16px;font-weight:700;margin-left:auto}
.zone .low{display:flex;align-items:center;gap:4px}
.zone .voir{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:700;text-transform:uppercase;color:var(--blue)}
.zone .st{position:absolute;top:-10px;right:8px;font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--tc);border-radius:4px;padding:0 6px}
.acts.g2{grid-template-columns:1fr 1fr 1fr 1fr}
.zones .bid{font-size:15px;padding:5px 1px}.zones .bid small{font-size:9px}.zones .bid.pass{font-size:11px}
.zones.n3 .zone:last-child .bid{font-size:17px}
.acts4{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:5px}
.acts4 .btn{padding:8px 2px;font-size:14px;flex-direction:column;gap:0;line-height:1.05}
.acts4 .btn small{font-family:var(--body);font-size:10px;text-transform:none;font-weight:600;opacity:.9}

/* Résultats à 2 : « Match TV », les deux équipes face à face sur un terrain */

.tvpl{display:flex;flex-direction:column;align-items:center;width:84px;min-width:0}

/* Les ordis estiment la force (un peu flou), selon leur caractère, ce qu'il leur reste et la rareté du poste */

function computeAI(){
  const c=cardOf(G.cur.i),st=packOf().stats,left=G.order.slice(G.pos).map(cardOf);
  G.teams.forEach((t,ti)=>{
    const slot=slotFor(t,c);if(!t.ai||!slot){G.cur.max[ti]=-1;return}
    const need=emptySlots(t),avg=G.budget/G.slots.length,est=estimate(c);

function say(ti,k){const t=G.teams[ti];if(SIM||!t||!t.ai)return;SAY[ti]={text:pick(LINES[t.pers][k]),until:Date.now()+2200}}

function playReveal(){

  const later=(f,ms)=>{if(fast)f();else timers.push(setTimeout(f,ms))};

function rewards(){
  const humans=G.teams.filter(t=>!t.ai),me=G.mode==="solo"?G.teams[0]:null,win=G.mode==="solo"&&G.winner===0;
  const mine=[];humans.forEach(t=>G.slots.forEach(k=>{const pk=t.sl[k];if(pk)mine.push({pk,c:cardOf(pk.i)})}));
  const top=me?me.score.total:Math.max(...humans.map(t=>t.score.total));
  const xp=Math.round(top/12)+(win?40:0)+(G.daily?20:0)+(G.mode==="amis"?25:0);
  const before=lvl(P.xp).n;P.xp+=xp;P.games++;
  if(G.mode==="solo"){if(win){P.wins++;P.streakW++;P.bestStreakW=Math.max(P.bestStreakW,P.streakW)}else P.streakW=0;
    if(!P.best||me.score.total>P.best.score)P.best={score:me.score.total,pack:packOf().name}}
  if(!P.packsPlayed.includes(G.pack))P.packsPlayed.push(G.pack);
  if(G.daily&&me){const d=P.daily[G.daily]||{best:0};d.best=Math.max(d.best,me.score.total);P.daily[G.daily]=d;
    const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    if(P.dstreak.last!==G.daily){P.dstreak.n=P.dstreak.last===ys?P.dstreak.n+1:1;P.dstreak.last=G.daily}}
  P.st.gold+=mine.filter(x=>x.pk.golden).length;P.st.star+=mine.filter(x=>x.c.p>=92).length;if(G.mode==="amis")P.st.amis++;
  const ctx={G,win,me,humans,mine};
  const newAlbum=albumAdd(G.pack,mine.map(x=>x.c.n));
  const doneM=missionsAfter(ctx);
  const newAch=ACH.filter(a=>!P.ach[a.id]&&a.ok(ctx));newAch.forEach(a=>P.ach[a.id]=today());
  saveP();

}

  <textarea id="ptxt" placeholder="Karim ; ATT ; FC Quartier ; 88&#10;Yanis ; G ; 75&#10;Sofiane ; MIL ; 82" aria-label="Joueurs du pack">${esc(c.txt||"")}</textarea>
  <p class="err" id="perr"></p>
  <button class="btn go" data-act="saveperso">Enregistrer le pack</button></div>`}
function saveperso(){const name=$("#pname").value.trim(),txt=$("#ptxt").value,{lines,bad}=parsePerso(txt),err=$("#perr");
  if(!name){err.textContent="Donne un nom à ton pack.";return}
  if(bad.length){err.textContent=`Ligne${bad.length>1?"s":""} ${bad.slice(0,6).join(", ")} : écris Nom ; Poste ; Note (poste G, DEF, MIL ou ATT).`;return}
  const cnt={G:0,DEF:0,MIL:0,ATT:0};lines.forEach(l=>cnt[l.split("/")[1]]++);
  if(lines.length<15||lines.length>80){err.textContent=`Il faut entre 15 et 80 joueurs (tu en as ${lines.length}).`;return}
  const miss=Object.entries(cnt).filter(([k,v])=>v<3).map(([k])=>POS[k].l.toLowerCase()+"s");
  if(miss.length){err.textContent="Il manque des "+miss.join(", ")+" (3 minimum par poste).";return}
  const id=EDIT.id||"perso_"+Date.now().toString(36),c={id,name,raw:lines.join("\n"),txt};
  const i=P.custom.findIndex(x=>x.id===id);if(i>=0)P.custom[i]=c;else P.custom.push(c);regCustom(c);saveP();toast("Pack enregistré");go("perso")}
/* ===================== Actions ===================== */
document.addEventListener("click",e=>{
  const w=e.target.closest(".wrap");if(w&&e.target===w&&w.dataset.close){if(PAUSED)resume();else closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="go")go(v);
  else if(a==="setup"){SETUP={mode:v,format:"five",pack:PACKS[P.pack]&&packOpen(P.pack)?P.pack:DEFPK,nai:P.nai,tempo:P.tempo,diff:P.diff||"normal",chaos:P.chaos!==false,names:P.names.slice()};OPTOPEN=false;go("setup")}
  else if(a==="packs"){PK_TAB=null;PK_Q="";packsSheet()}
  else if(a==="pktab"){PK_TAB=v;PK_Q="";packsSheet()}
  else if(a==="pickpack"){if(!packOpen(v)){buySheet("pk_"+v);return}SETUP.pack=v;closeSheet();render()}
  else if(a==="seg"){SETUP[b.dataset.k]=b.dataset.k==="nai"?+v:v;const inSheet=!!b.closest(".sheet");render();if(inSheet)optsSheet()}
  else if(a==="fmt"){SETUP.format=v;render()}
  else if(a==="addname"){if(SETUP.names.length<4)SETUP.names.push("Joueur "+(SETUP.names.length+1));render()}
  else if(a==="delname"){SETUP.names.splice(+v,1);render()}
  else if(a==="start"){$$("[data-name]").forEach(i=>SETUP.names[+i.dataset.name]=i.value);Object.assign(P,{pack:SETUP.pack,nai:SETUP.nai,tempo:SETUP.tempo,diff:SETUP.diff,chaos:SETUP.chaos});if(SETUP.mode==="amis")P.names=SETUP.names.slice();saveP();SERIES=null;startGame(SETUP)}
  else if(a==="draw"){if(G.phase==="sold"||G.phase==="skip"||G.phase==="draw"){if(isOver())finish();else draw()}}
  else if(a==="bid"){const ti=b.dataset.i!=null?+b.dataset.i:G.mode==="solo"?0:G.cur.turn;raise(ti,+v)}
  else if(a==="pass"){const ti=b.dataset.i!=null?+b.dataset.i:G.mode==="solo"?0:G.cur.turn;pass(ti)}
  else if(a==="voir")voirSheet(+v);
  else if(a==="rules")rulesSheet();
  else if(a==="pals")palSheet();
  else if(a==="pal"){P.pal=v;saveP();applyPal();palSheet()}
  else if(a==="legal")legalSheet();
  else if(a==="pause")pauseSheet();
  else if(a==="resumePause")resume();
  else if(a==="resume"){G=loadGame();if(!G){render();return}rnd=mulberry((G.seed||7)+G.pos*7919);SAY={};SERIES=null;PAUSED=false;
    if(G.phase==="auction"){G.cur.turnEnd=G.ms?Date.now()+G.ms:0;G.cur.aiAt=G.teams[G.cur.turn].ai?Date.now()+1200:0}go("game")}
  else if(a==="newpack"){SETUP=Object.assign({},G.setup,{seed:undefined,daily:undefined});go("setup");PK_TAB=null;PK_Q="";packsSheet()}
  else if(a==="skip"){SKIP&&SKIP()}
  else if(a==="chaos"){SETUP.chaos=!SETUP.chaos;render();optsSheet()}
  else if(a==="opts")optsSheet();
  else if(a==="close"){if(PAUSED&&SCREEN==="game")pauseSheet();else closeSheet()}
  else if(a==="quit"){PAUSED=false;stopLoop();saveGame();G=null;go("home")}
  else if(a==="revanche"){startGame(G.setup)}
  else if(a==="share")share();
  else if(a==="daily")startDaily();
  else if(a==="buy")buySheet(v);
  else if(a==="pay")PAY.buy(v);
  else if(a==="shoptab"){SHOP_TAB=v;render()}
  else if(a==="restore")restoreSheet();
  else if(a==="dorestore")PAY.restore($("#remail").value.trim());
  else if(a==="sound"){P.sound=P.sound===false;saveP();render()}
  else if(a==="albpack")albumSheet(v);
  else if(a==="newperso"){EDIT={};go("edit")}
  else if(a==="editperso"){const c=P.custom.find(x=>x.id===v);EDIT={id:c.id,name:c.name,txt:c.txt||c.raw.split("\n").map(l=>{const x=l.split("/");return`${x[0]} ; ${x[1]} ; ${x[2]} ; ${x[4]}`}).join("\n")};go("edit")}
  else if(a==="delperso"){if(DEL!==v){DEL=v;render();return}P.custom=P.custom.filter(x=>x.id!==v);delete PACKS[v];DEL=null;if(P.pack===v)P.pack=DEFPK;saveP();render()}
  else if(a==="saveperso")saveperso();
});
document.addEventListener("input",e=>{const i=e.target.closest("[data-name]");if(i&&SETUP)SETUP.names[+i.dataset.name]=i.value});
/* Simulation pour régler les ordis (console : simulate(500)) */
window.simulate=function(n=300,pack=DEFPK,nai=3){
  SIM=true;const st={games:0,left:0,empty:0,wins:{},spentMin:1e9};
  for(let g=0;g<n;g++){startGame({mode:"solo",allai:true,nai,pack,format:"five",tempo:"aucun"});
    let guard=0;while(G.phase!=="end"&&guard++<5000){if(G.phase==="auction")aiTurn(G.cur.turn);else draw()}
    st.games++;G.teams.forEach(t=>{st.left+=t.money;st.empty+=emptySlots(t)});if(G.winner>=0){const p=G.teams[G.winner].pers;st.wins[p]=(st.wins[p]||0)+1}}
  SIM=false;rnd=Math.random;G=null;
  return{games:st.games,avgLeft:+(st.left/(n*nai)).toFixed(1),emptyPerTeam:+(st.empty/(n*nai)).toFixed(3),wins:st.wins};
};
applyPal();render();PAY.back();
